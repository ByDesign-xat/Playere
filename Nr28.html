<!DOCTYPE html>
<html lang="ro"><head>

<meta charset="UTF-8">
<title>ByDesign</title>

<style>

:root{
--accent:red;
}

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:transparent;
font-family:Arial;
color:white;
}

#layout{
display:flex;
gap:20px;
align-items:center;
}

.speaker{
width:120px;
height:420px;
background:#111;
border-radius:10px;
border:2px solid var(--accent);
box-shadow:0 0 20px var(--accent) inset;
display:flex;
flex-direction:column;
justify-content:space-around;
align-items:center;
padding:20px 0;
}

.driver{
width:80px;
height:80px;
border-radius:50%;
border:4px solid var(--accent);
display:flex;
justify-content:center;
align-items:center;
}

.cone{
width:55px;
height:55px;
border-radius:50%;
background:radial-gradient(circle,#ff4444 0%,#550000 60%,#000 90%);
box-shadow:0 0 10px var(--accent);
transition:transform .05s;
}

#player{
width:340px;
height:440px;
border:3px solid var(--accent);
border-radius:12px;
text-align:center;
position:relative;
overflow:hidden;
}

#player::before{
content:"";
position:absolute;
top:0;
left:0;
right:0;
bottom:0;
background:linear-gradient(45deg,red,orange,yellow,lime,cyan,blue,magenta,red);
background-size:400% 400%;
animation:rgbmove 8s linear infinite;
z-index:-2;
}

#player::after{
content:"";
position:absolute;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,0.65);
z-index:-1;
}

@keyframes rgbmove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

#radioName{
font-size:24px;
margin-top:10px;
letter-spacing:2px;
text-shadow:0 0 5px var(--accent),0 0 10px var(--accent),0 0 20px var(--accent);
}

#clock{
font-size:14px;
margin-top:6px;
}

#listeners{
font-size:14px;
}

#coverWrap{
width:150px;
height:150px;
margin:18px auto;
border-radius:50%;
overflow:hidden;
border:4px solid var(--accent);
}

#cover{
width:100%;
height:100%;
object-fit:cover;
animation:spin 6s linear infinite;
}

@keyframes spin{
from{transform:rotate(0)}
to{transform:rotate(360deg)}
}

#artist{
margin-top:10px;
font-weight:bold;
}

#song{
font-size:15px;
font-weight:bold;
color:red;
width:260px;
margin:0 auto;
overflow:hidden;
white-space:nowrap;
}

#song span{
display:inline-block;
padding-left:100%;
animation:scrollSong 12s linear infinite;
}

@keyframes scrollSong{
0%{transform:translateX(0)}
100%{transform:translateX(-100%)}
}

/* VU */
#vuMeter{
width:210px;
height:75px;
margin:8px auto;
/* ALTERAÇÃO: fundo usa a cor escolhida */
background:linear-gradient(var(--accent),#e2e0d5);
border-radius:8px;
border:2px solid var(--accent);
box-shadow:inset 0 0 6px rgba(0,0,0,0.7),0 0 8px rgba(0,0,0,0.6);
position:relative;
}

.vuScale{
position:absolute;
top:6px;
width:100%;
display:flex;
justify-content:space-around;
font-size:10px;
font-weight:bold;
color:#222;
}

.vuScale .peak{
color:var(--accent);
}

#vuNeedle{
width:3px;
height:50px;
background:var(--accent);
position:absolute;
bottom:10px;
left:50%;
transform-origin:bottom center;
transform:rotate(-55deg);
transition:transform .05s linear;
}

#vuPivot{
width:10px;
height:10px;
background:black;
border-radius:50%;
position:absolute;
bottom:6px;
left:calc(50% - 5px);
}

.controls{
position:absolute;
bottom:3px;
width:100%;
display:flex;
justify-content:center;
align-items:center;
gap:10px;
}

button{
background:var(--accent);
border:none;
padding:8px 16px;
border-radius:20px;
cursor:pointer;
font-weight:bold;
color:white;
}

#colors{
position:absolute;
top:6px;
right:6px;
display:flex;
flex-direction:column;
gap:6px;
}

.color{
width:14px;
height:14px;
border-radius:50%;
cursor:pointer;
border:2px solid white;
}

.red{background:red}
.blue{background:#00bfff}
.green{background:#00ff88}
.pink{background:#ff00c8}
.yellow{background:#ffd000}

#volValue{
color:var(--accent);
font-weight:bold;
width:50px;           /* 👈 FIX */
text-align:center;
display:inline-block; /* 👈 IMPORTANT */
}

</style>

</head>

<body>

<div id="layout">

<div class="speaker">
<div class="driver"><div class="cone"></div></div>
<div class="driver"><div class="cone"></div></div>
<div class="driver"><div class="cone"></div></div>
</div>

<div id="player">

<div id="colors">
<div class="color red" onclick="setColor('red')"></div>
<div class="color blue" onclick="setColor('#00bfff')"></div>
<div class="color green" onclick="setColor('#00ff88')"></div>
<div class="color pink" onclick="setColor('#ff00c8')"></div>
<div class="color yellow" onclick="setColor('#ffd000')"></div>
</div>

<div id="radioName">𝕷𝖆𝕱𝖆𝖒𝖎𝖑𝖎𝖆</div>

<div id="clock"></div>
<div id="listeners">🎧 Încărcare...</div>

<div id="coverWrap">
<img id="cover" src="https://i.imgur.com/pb1FfHi.png">
</div>

<div id="artist">Încărcare...</div>
<div id="song"><span>Încărcare...</span></div>

<div id="vuMeter">

<div class="vuScale">
<span>-20</span>
<span>-10</span>
<span>-7</span>
<span>-5</span>
<span>-3</span>
<span>0</span>
<span class="peak">+3</span>
</div>

<div id="vuNeedle"></div>
<div id="vuPivot"></div>

</div>

<div class="controls">

<button id="play">▶</button>
<input type="range" id="volume" min="0" max="1" step="0.01" value="1">
<span id="volValue">100%</span>

</div>

</div>

<div class="speaker">
<div class="driver"><div class="cone"></div></div>
<div class="driver"><div class="cone"></div></div>
<div class="driver"><div class="cone"></div></div>
</div>

</div>

<audio id="audio" crossorigin="anonymous" src="https://radio.sonicpanel.ro:10922/stream"></audio>

<script>

const RADIO_NAME="LaFamilia"
const STREAM="https://radio.sonicpanel.ro:10922/stream"
const STATS="https://radio.sonicpanel.ro:10922/stats?json=1"
const cones = document.querySelectorAll(".cone")

function setColor(c){

document.documentElement.style.setProperty('--accent',c)

/* atualizar VU */
document.getElementById("vuNeedle").style.background=c
document.querySelector(".vuScale .peak").style.color=c
document.getElementById("vuMeter").style.borderColor=c
/* ALTERAÇÃO: atualizar fundo do VU */
document.getElementById("vuMeter").style.background="linear-gradient("+c+", #e2e0d5)"

}

/* AUDIO */

const audio=document.getElementById("audio")
audio.src=STREAM

const play=document.getElementById("play")
const volume=document.getElementById("volume")

audio.volume=1
volume.oninput = e => {

let v = e.target.value

audio.volume = v

let percent = Math.round(v * 100)

volValue.innerText = percent + "%"

}

/* CLOCK */

function updateClock(){
clock.innerText=new Date().toLocaleDateString()+" | "+new Date().toLocaleTimeString()
}

setInterval(updateClock,1000)
updateClock()

/* VU */

let ctx
let analyser
let dataArray
let started=false
const needle=document.getElementById("vuNeedle")

function initVU(){

ctx=new(window.AudioContext||window.webkitAudioContext)()

const src=ctx.createMediaElementSource(audio)

analyser=ctx.createAnalyser()
analyser.fftSize=256

src.connect(analyser)
analyser.connect(ctx.destination)

dataArray=new Uint8Array(analyser.frequencyBinCount)

animateVU()

}

function animateVU(){

requestAnimationFrame(animateVU)

if(!analyser) return

analyser.getByteFrequencyData(dataArray)

// 🎧 BASS = frecvențe joase (primele valori)
let bass = 0

for(let i=0;i<5;i++){
bass += dataArray[i]
}

bass = bass / 2.5
currentBass = bass / 255

// 🎚️ VU needle (peak)
let max = Math.max(...dataArray)
let angle = (max/255)*110 - 80
needle.style.transform = `rotate(${angle}deg)`

}



/* SPEAKERS */

function startSpeakers(){

function animate(){

cones.forEach(c=>{

let scale = 1 + currentBass * 0.1
c.style.transform = `scale(${scale})`

})

speakerAnimation = requestAnimationFrame(animate)

}

animate()
}

function stopSpeakers(){

cancelAnimationFrame(speakerAnimation)

cones.forEach(c=>{
c.style.transform = "scale(1)"
})

}

play.onclick = async()=>{

if(!started){
initVU()
started=true
}

if(audio.paused){

await ctx.resume()
audio.play()
play.textContent="⏸"

startSpeakers() // ✅ PORNEȘTE

}else{

audio.pause()
play.textContent="▶"

stopSpeakers() // ✅ OPREȘTE

}

}

/* STATS */

window.statsCB=function(d){

if(!d)return

listeners.innerText="🎧 "+(d.currentlisteners||0)+" Listen"

if(d.songtitle){

let p=d.songtitle.split(" - ")

artist.innerText=p[0]||""
song.innerHTML="<span>"+(p[1]||p[0])+"</span>"

fetchCover(d.songtitle)

}

}

function updateStats(){

let s=document.createElement("script")

s.src=STATS+"&callback=statsCB&r="+Math.random()

document.body.appendChild(s)

setTimeout(()=>s.remove(),4000)

}

setInterval(updateStats,15000)
updateStats()

function fetchCover(track){

let s=document.createElement("script")

s.src="https://itunes.apple.com/search?term="+encodeURIComponent(track)+"&media=music&limit=1&callback=coverCB"

document.body.appendChild(s)

setTimeout(()=>s.remove(),4000)

}

window.coverCB=function(data){

if(data.results && data.results.length>0){

cover.src=data.results[0].artworkUrl100.replace("100x100","600x600")

}else{

cover.src="https://xatimg.com/image/oacvd5ltA14X.png"

}

}


// --- PROTECT SCRIPT ---


document.addEventListener("contextmenu", e => e.preventDefault());

document.onkeydown = function(e) {

if(e.keyCode == 123) return false; // F12

if(e.ctrlKey && e.shiftKey && e.keyCode == 73) return false; // CTRL+SHIFT+I

if(e.ctrlKey && e.shiftKey && e.keyCode == 74) return false; // CTRL+SHIFT+J

if(e.ctrlKey && e.keyCode == 85) return false; // CTRL+U

};

</script>

</body></html>
