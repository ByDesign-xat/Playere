        <audio id="audio-xat" src="https://radio.sonicpanel.ro:10922/radio.mp3" crossorigin="anonymous"></audio>

<script>
            // Variabili Globali
 var audio = document.getElementById('audio-xat');
var ctx = new (window.AudioContext || window.webkitAudioContext)();
var analyser = ctx.createAnalyser();
var source = ctx.createMediaElementSource(audio);

source.connect(analyser);
analyser.connect(ctx.destination);

analyser.fftSize = 64;

var bufferLength = analyser.frequencyBinCount;
var dataArray = new Uint8Array(bufferLength);
            var playBtn = document.getElementById('play-xat');
            var stopBtn = document.getElementById('stop-xat');
            var globo = document.getElementById('globo-xat');
            var marquee = document.getElementById('marqueeMusic-xat');
            var lastSong = "";
			
			
			

            // Funzione Orologio
            function updateClock() {
                var ora = new Date();
                document.getElementById('clock-xat').innerHTML = ora.toLocaleTimeString('ro-RO');
                document.getElementById('date-xat').innerHTML = ora.toLocaleDateString('ro-RO', { weekday: 'short', day: '2-digit', month: 'short', years: '2-digit' }).toUpperCase();
            }
            setInterval(updateClock, 1000);
            updateClock();
			
			


            // Funzione Titoli e Cover
function updateMusicInfo() {
    fetch("https://radio.sonicpanel.ro:10922/stats?json=1")
    .then(response => response.json())
    .then(data => {

        console.log(data);

        var songTitle = data.songtitle || "UNKNOWN";

        if (songTitle !== lastSong) {
            lastSong = songTitle;
            marquee.textContent = "NOW ON AIR: ★ " + songTitle + " ★";
        }

        if (data.servertitle) {
            document.title = data.servertitle;
        }

    })
    .catch(err => {
        console.log("API error", err);
        marquee.textContent = "RADIO ONLINE ★";
    });
}
            setInterval(updateMusicInfo, 8000);
            updateMusicInfo();

            // Controlli Play/Pause
playBtn.onclick = function() {

    if (ctx.state === "suspended") {
        ctx.resume();
    }

    if (audio.paused) {
        audio.play();
        animateViz();
        playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
    } else {
        audio.pause();
        playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
    }
};

            // Controllo Stop
stopBtn.onclick = function() {
    audio.pause();
    audio.currentTime = 0;
    playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
    globo.style.animationPlayState = "paused";
};

            // Controllo Volume
            var bars = document.querySelectorAll('.vol-bar');
            bars.forEach(function(bar, index) {
                bar.onclick = function() {
                    var v = parseFloat(bar.getAttribute('data-v'));
                    audio.volume = v;
                    bars.forEach(function(b, i) {
                        if (i <= index) b.classList.add('active');
                        else b.classList.remove('active');
                    });
                };
            });
			
			function getCity() {
    if (!navigator.geolocation) {
        document.querySelector("#city-box span").innerHTML = "NO GEO";
        return;
    }

    navigator.geolocation.getCurrentPosition(function(pos) {

        var lat = pos.coords.latitude;
        var lon = pos.coords.longitude;

        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
        .then(res => res.json())
        .then(data => {

            var city =
                data.address.city ||
                data.address.town ||
                data.address.village ||
                data.address.county ||
                "UNKNOWN";

            document.querySelector("#city-box span").innerHTML = "📍 " + city;

        })
        .catch(() => {
            document.querySelector("#city-box span").innerHTML = "UNKNOWN";
        });

    }, function() {
        document.querySelector("#city-box span").innerHTML = "BLOCKED";
    });
}

getCity();


			function createBars(container) {
    for (let i = 0; i < 16; i++) {
        let bar = document.createElement("div");
        bar.className = "viz-bar";
        container.appendChild(bar);
    }
}

createBars(document.getElementById("viz-left"));
createBars(document.getElementById("viz-right"));



// ================== ADD-ON VIZUALIZER FIX (NU ȘTERGE NIMIC) ==================

// prevenim pornirea multiplă
var vizStarted = false;

// animatie reala
function animateViz() {
    requestAnimationFrame(animateViz);

    if (!analyser) return;

    analyser.getByteFrequencyData(dataArray);

    let barsL = document.querySelectorAll("#viz-left .viz-bar");
    let barsR = document.querySelectorAll("#viz-right .viz-bar");

    for (let i = 0; i < barsL.length; i++) {

        let val = dataArray[i] || 0;
let boxHeight = document.getElementById("viz-left").clientHeight;
let height = (val / 255) * boxHeight;

        if (barsL[i]) barsL[i].style.height = height + "px";
        if (barsR[i]) barsR[i].style.height = height + "px";
    }
}

// PATCH peste play (fara sa stergem codul tau)
var oldPlay = playBtn.onclick;

playBtn.onclick = function() {

    // porneste audio context daca e blocat
    if (ctx.state === "suspended") {
        ctx.resume();
    }

    // ruleaza functia ta originala
    oldPlay();

    // porneste vizualizer o singura data
    if (!vizStarted) {
        animateViz();
        vizStarted = true;
    }
};




// --- PROTECT SCRIPT ---


document.addEventListener("contextmenu", e => e.preventDefault());

document.onkeydown = function(e) {

if(e.keyCode == 123) return false; // F12

if(e.ctrlKey && e.shiftKey && e.keyCode == 73) return false; // CTRL+SHIFT+I

if(e.ctrlKey && e.shiftKey && e.keyCode == 74) return false; // CTRL+SHIFT+J

if(e.ctrlKey && e.keyCode == 85) return false; // CTRL+U

};

 </script>
