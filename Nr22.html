<!DOCTYPE html>
<html lang="ro-RO">
<head>
    <title>ByDesign</title>
    <meta name="description" content="RAU" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
    <meta property="og:title" content="RAU Player" />
    <meta property="og:description" content="RAU" />
    <link rel="icon" type="image/png" href="https://xatimg.com/image/oacvd5ltA14X.png" sizes="48x48" />
    <link rel="icon" type="image/png" href="https://xatimg.com/image/oacvd5ltA14X.png" sizes="96x96" />
    <link rel="icon" type="image/png" href="https://xatimg.com/image/oacvd5ltA14X.png" sizes="144x144" />
    <link rel="icon" type="image/png" href="https://xatimg.com/image/oacvd5ltA14X.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="https://i.imgur.com/nNh98kV.png" sizes="180x180"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root {
            --bg-dark: #1a1e23; --accent-blue: #00d2ff; --lcd-color: #5f9ea0;
            --needle-green: #2ecc71; --glow-color: rgba(0, 210, 255, 0.8);
            --a: #00d2ff;
        }
        * { -webkit-user-select: none; user-select: none; outline: none; }
        body { background-color: transparent; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #fff; overflow: hidden; }
        .player-frame { width: 380px; background: linear-gradient(180deg, #2c323a 0%, #1a1e23 100%); border-radius: 15px; padding: 25px; box-shadow: 0 30px 60px rgba(0,0,0,0.9); border: 1px solid #3d444e; position: relative; }
        
        /* SCROLL TOP - CORRIGIDO PARA LINHA ÚNICA */
        .top-marquee-float { position: absolute; top: 8px; left: 0; width: 100%; height: 18px; background: rgba(0,0,0,0.3); overflow: hidden; border-bottom: 1px solid #333; z-index: 10; }
        #scroll-text { 
            display: inline-block; 
            position: absolute; 
            white-space: nowrap; /* Impede quebra de linha */
            font-size: 11px; 
            font-weight: 900; 
            color: var(--accent-blue); 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            line-height: 18px; 
            text-shadow: 0 0 5px var(--glow-color); 
        }
        
        .header-brand { text-align: center; font-size: 22px; font-weight: bold; margin: 12px 0 20px; color: #eee; font-style: italic; }
        .header-brand span { color: var(--accent-blue); }
        
        .eq-container { width: 100%; height: 80px; background: rgba(0,0,0,0.9); border-radius: 5px; margin-bottom: 20px; border: 1px solid #333; overflow: hidden; position: relative; }
        #eqCanvas { width: 100%; height: 100%; display: block; }
        .viz-mode-btn { position: absolute; top: 76px; right: 28px; background: rgba(0,0,0,0.5); border: 1px solid #444; color: var(--accent-blue); font-size: 9px; padding: 1px 6px; border-radius: 3px; cursor: pointer; z-index: 100; text-transform: uppercase; font-weight: bold; }

        .info-box { display: flex; gap: 15px; margin-bottom: 25px; }
        .cover-art { width: 110px; height: 110px; background: url('https://xatimg.com/image/oacvd5ltA14X.png') center/cover no-repeat; border: 2px solid #444; border-radius: 4px; }
        
        .lcd-screen { flex: 1; background: var(--lcd-color); color: #051a1a; padding: 8px; border-radius: 4px; border: 1px solid #4d7e80; display: flex; flex-direction: column; justify-content: space-between; min-height: 94px; position: relative; overflow: hidden; font-family: 'Courier New', monospace; font-weight: bold; }
        .lcd-top-row, .lcd-bottom-row { display: flex; justify-content: space-between; font-size: 10px; }
        #listeners-count { color: #b30000 !important; font-weight: 900; }
        
        .lcd-marquee-container { width: 100%; height: 25px; overflow: hidden; position: relative; background: rgba(0,0,0,0.05); margin: 5px 0; }
        #lcd-scroll-text { 
            position: absolute; 
            white-space: nowrap; /* Impede quebra de linha */
            font-size: 13px; 
            color: #051a1a; 
            line-height: 25px;
        }
        
        .main-btn-area { display: flex; justify-content: center; margin-bottom: 25px; }
        .play-stop-btn { background: none; border: none; cursor: pointer; }
        #svg-pause { display: none; }
        
        .volume-wrapper { display: flex; align-items: center; gap: 12px; }
        input[type=range] { flex: 1; accent-color: var(--accent-blue); cursor: pointer; }
        .label-vol { text-align: center; font-size: 11px; color: #aaa; margin-top: 5px; font-weight: bold; }
        
        .vu-section { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; }
        .vu-box { flex: 1; text-align: center; }
        .vu-meter-bg { height: 85px; background: #1a1e23 url('https://xatimg.com/image/bPufbrBoxlr4.png') no-repeat center; background-size: 100% 100%; border: 2px solid #1a1e23; position: relative; overflow: hidden; border-radius: 4px; }
        .needle { position: absolute; bottom: 5px; left: 50%; width: 2.5px; height: 75px; background: var(--needle-green); transform-origin: bottom center; transform: rotate(-60deg); transition: transform 0.1s ease-out; z-index: 5; }
        
        .footer-nav { display: flex; justify-content: space-around; margin-top: 25px; font-size: 14px; }
        .footer-nav a { text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 6px; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="player-frame">
        <div class="top-marquee-float"><div id="scroll-text"> </div></div>
        <div class="header-brand">Radio <span>LaFamilia </span></div>
        <button class="viz-mode-btn" id="changeViz">SchimbĂ MOD</button>
        <div class="eq-container"><canvas id="eqCanvas"></canvas></div>
        <div class="info-box">
            <div class="cover-art" id="coverArt"></div>
            <div class="lcd-screen">
                <div class="lcd-top-row"><div id="lcd-greeting">BUNA ZIUA!</div><div id="lcd-date"> </div></div>
                <div class="lcd-marquee-container"><div id="lcd-scroll-text"> </div></div>
                <div class="lcd-bottom-row"><div id="listeners-count">Ascultatorii: </div><div id="lcd-clock"> </div></div>
            </div>
        </div>
        <div class="main-btn-area">
            <button class="play-stop-btn" id="playBtn">
                <svg viewBox="0 0 100 100" width="80" height="80">
                    <circle cx="50" cy="50" r="45" fill="#3d444e" />
                    <g id="svg-play"><path d="M40,30 L70,50 L40,70 Z" fill="#00ff00" /></g>
                    <g id="svg-pause"><rect x="35" y="30" width="10" height="40" fill="#ff0000" /><rect x="55" y="30" width="10" height="40" fill="#ff0000" /></g>
                </svg>
            </button>
        </div>
        <div class="volume-wrapper"><input type="range" id="volSlider" min="0" max="1" step="0.01" value="1"></div>
        <div class="label-vol" id="volDisplay"> </div>
        <div class="vu-section">
            <div class="vu-box"><div class="vu-meter-bg"><div class="needle" id="needleL"></div></div></div>
            <div class="vu-box"><div class="vu-meter-bg"><div class="needle" id="needleR"></div></div></div>
        </div>
        <div class="footer-nav">
            <a href="https://uxat.eu/" target="_blank" style="color:#ffff00"><i class="fa-brands fa-rocketchat"></i> Chat </a>
            <a href="https://dedicatiipanel.ro/dedicatii/lafamilia/" target="_blank" style="color:#00d2ff"><i class="fa-solid fa-pen-to-square"></i> Dedicatii</a>
        </div>
    </div>

    <audio id="radio" crossorigin="anonymous"></audio>

    <script>
    (function(){
        const _X = "cmFkaW9kb3NhbWlnb3N1bmlkb3M=";
        const _D = "aHR0cHM6Ly91eGF0LmV1";
        const _S = ["aHR0cHM6Ly9yYWRpby5zb25pY3BhbmVsLnJvOjEwOTIyL3N0YXRzP2pzb249MQ==","aHR0cHM6Ly9yYWRpby5zb25pY3BhbmVsLnJvOjEwOTIyL3N0cmVhbQ=="];
        
        const aud = document.getElementById('radio'), 
              playBtn = document.getElementById('playBtn'), 
              volSlider = document.getElementById('volSlider'),
              cv = document.getElementById('eqCanvas'), 
              ctx = cv.getContext('2d'),
              nL = document.getElementById('needleL'), 
              nR = document.getElementById('needleR'),
              svgPlay = document.getElementById('svg-play'), 
              svgPause = document.getElementById('svg-pause');

        let ac, an, src, dat, currentTag = "", vizMode = 3, winampPeaks = [];

        const _validate = () => {
            const h = window.location.hostname.toLowerCase();
            let pUrl = ""; try { pUrl = window.parent.location.href.toLowerCase(); } catch(e) {}
            if (h.includes(atob(_D)) || pUrl.includes(atob(_D))) {
                return (pUrl.includes(atob(_X)) || window.location.pathname.includes(atob(_X)));
            }
            return true;
        };

        function initVisuals(){
            if(!ac){
                ac = new(window.AudioContext || window.webkitAudioContext)();
                an = ac.createAnalyser(); 
                src = ac.createMediaElementSource(aud);
                src.connect(an); an.connect(ac.destination);
                an.fftSize = 128; dat = new Uint8Array(64);
                for(let i=0; i<64; i++) winampPeaks[i] = {p:0, h:0};
                
                (function dr(){
                    requestAnimationFrame(dr); 
                    an.getByteFrequencyData(dat);
                    cv.width = 330; cv.height = 80; ctx.clearRect(0,0,330,80);
                    
                    const barCount = 32; const bW = 10.3;
                    for(let i=0; i<barCount; i++){
                        let val = dat[i];
                        let h = val / 3.5;
                        
                        if(vizMode === 3){ 
                            if(h > winampPeaks[i].p) { winampPeaks[i].p = h; winampPeaks[i].h = 10; }
                            else { if(winampPeaks[i].h > 0) winampPeaks[i].h--; else winampPeaks[i].p -= 1.2; }
                            let g = ctx.createLinearGradient(0,80,0,80-h);
                            g.addColorStop(0,"#228B22"); g.addColorStop(1,"#ADFF2F");
                            ctx.fillStyle = g; ctx.fillRect(i*bW, 80-h, 8, h);
                            ctx.fillStyle = "#fff"; ctx.fillRect(i*bW, 80-winampPeaks[i].p-2, 8, 2);
                        } else if(vizMode === 0){ 
                            ctx.fillStyle = '#00d2ff'; ctx.fillRect(i*bW, 80-h, 8, h);
                        } else if(vizMode === 1){ 
                            ctx.strokeStyle = '#00d2ff'; ctx.lineWidth=2; ctx.beginPath();
                            i===0?ctx.moveTo(0,80-h):ctx.lineTo(i*bW,80-h); ctx.stroke();
                        } else if(vizMode === 2){ 
                            ctx.fillStyle = '#00d2ff'; ctx.fillRect(i*bW, 40-h/2, 8, h);
                        } else if(vizMode === 4){ 
                            ctx.beginPath(); ctx.arc(165, 40, h, 0, Math.PI*2); ctx.strokeStyle='#00d2ff'; ctx.stroke();
                        } else if(vizMode === 5){ 
                            ctx.fillStyle = `rgb(${val+100},50,0)`; ctx.fillRect(i*bW, 80-h, 8, h);
                        } else { 
                            ctx.fillStyle = '#00d2ff'; ctx.beginPath(); ctx.arc(i*bW+4, 80-h, 2, 0, Math.PI*2); ctx.fill();
                        }
                    }
                    nL.style.transform = `rotate(${(dat[2]/255)*95-55}deg)`;
                    nR.style.transform = `rotate(${(dat[8]/255)*95-55}deg)`;
                })();
            }
        }

        function startMarquees() {
            $(".top-marquee-float, .lcd-marquee-container").each(function(){
                const c = $(this); 
                const ct = c.find("div");
                if(ct.data('timer')) clearInterval(ct.data('timer'));
                
                let pos = c.width();

                const textWidth = ct[0].scrollWidth; 
                
                const t = setInterval(() => {
                    pos--; 

                    if(pos < -textWidth) pos = c.width();
                    ct.css("left", pos + "px");
                }, 25);
                ct.data('timer', t);
            });
        }

        document.getElementById('changeViz').onclick = () => { vizMode = (vizMode + 1) % 7; };

        playBtn.onclick = () => {
            if(!_validate()) return;
            initVisuals();
            if(ac.state === 'suspended') ac.resume();
            if(aud.paused){
                aud.src = atob(_S[1]) + "?t=" + Date.now();
                aud.play();
                svgPlay.style.display = "none"; svgPause.style.display = "block";
            } else {
                aud.pause(); aud.src = '';
                svgPlay.style.display = "block"; svgPause.style.display = "none";
            }
        };

        window.onload = () => {
            if(!_validate()) { document.body.innerHTML = ""; return; }
            aud.volume = localStorage.getItem('player_vol') ||1;
            volSlider.value = aud.volume;
            document.getElementById('volDisplay').innerText = `VOLUME: ${Math.round(aud.volume * 100)}%`;
            upClock(); setInterval(upClock, 1000);
            fetchMetadata(); setInterval(fetchMetadata, 15000);
            startMarquees();

            aud.src = atob(_S[1]) + "?t=" + Date.now();
            aud.play().then(() => {
                initVisuals();
                svgPlay.style.display = "none"; svgPause.style.display = "block";
            }).catch(() => {
                document.getElementById('lcd-scroll-text').innerText = " ";
                startMarquees();
            });
        };

        async function fetchMetadata() {
            try {
                const r = await fetch(atob(_S[0]) + "&t=" + Date.now());
                const d = await r.json();
                $('#listeners-count').text(`Ascultatori: ${String(d.currentlisteners || 0).padStart(2, '0')}`);
                if(d.songtitle && d.songtitle !== currentTag) {
                    currentTag = d.songtitle;
                    const clean = currentTag.trim().toUpperCase();
                    document.getElementById('scroll-text').innerText = clean;
                    document.getElementById('lcd-scroll-text').innerText = clean;

                    setTimeout(startMarquees, 100);
                    const pts = currentTag.split(" - ");
                    if(pts.length >= 2) fetchCover(pts[0].trim(), pts[1].trim());
                }
            } catch(e) {}
        }

        function fetchCover(a, t) {
            $.getJSON(`https://itunes.apple.com/search?term=${encodeURIComponent(a + " " + t)}&entity=song&limit=1&callback=?`, function(j){
                const img = (j.results && j.results.length > 0) ? j.results[0].artworkUrl100.replace("100x100","500x500") : "https://xatimg.com/image/oacvd5ltA14X.png";
                document.getElementById('coverArt').style.backgroundImage = `url(${img})`;
            });
        }

        function upClock(){
            const n = new Date();
            document.getElementById('lcd-greeting').innerText = n.getHours()<12?"BUNĂ DIMINEAŢA!":n.getHours()<18?"BUNĂ ZIUA!":"NOAPTE BUNĂ!";
            document.getElementById('lcd-date').innerText = n.toLocaleDateString('ro-RO');
            document.getElementById('lcd-clock').innerText = n.toLocaleTimeString('ro-RO');
        }

        volSlider.oninput = (e) => {
            aud.volume = e.target.value;
            localStorage.setItem('player_vol', e.target.value);
            document.getElementById('volDisplay').innerText = `VOLUME: ${Math.round(aud.volume * 100)}%`;
        };
        document.addEventListener('contextmenu', e => e.preventDefault());
    })();

// --- PROTECT SCRIPT ---


document.addEventListener("contextmenu", e => e.preventDefault());

document.onkeydown = function(e) {

if(e.keyCode == 123) return false; // F12

if(e.ctrlKey && e.shiftKey && e.keyCode == 73) return false; // CTRL+SHIFT+I

if(e.ctrlKey && e.shiftKey && e.keyCode == 74) return false; // CTRL+SHIFT+J

if(e.ctrlKey && e.keyCode == 85) return false; // CTRL+U

};


    </script>
</body>
</html>
