            :root {
                  --font: 'Poppins', sans-serif;
                  --primary: #00b4ff;
                  --black-300: #000;
                  --black-200: #0f0f0f;
                  --black-100: #1a1a1a;
				  --black-400: #da0000;
                  --light: #fff;
				  --clear: transparent

                  font-size: 62.5%;
                  user-select: none
            }

            * {
                  margin: 0;
                  padding: 0;
                  box-sizing: border-box
            }

            :after,
            :before {
                  content: '';
                  position: absolute
            }

            body {
                  width: 100%;
                  height: 100vh;
                  font-family: var(--font);
                  color: var(--light);
                  overflow-x: hidden;
                  background: var(--clear)
            }

            a,
            span {
                  display: inline-block
            }

            a {
                  text-decoration: none
            }

            img {
                  width: 100%;
                  object-fit: cover
            }

            h1,
            h2,
            h3,
            h4 {
                  line-height: 120%;
                  text-transform: capitalize
            }

            button {
                  border: none;
                  outline: 0;
                  cursor: pointer;
                  font-family: var(--font)
            }

            i.bx {
                  width: fit-content;
                  height: fit-content;
                  display: flex;
                  align-items: center;
                  justify-content: center
            }

            .flex {
                  display: flex
            }

            .center {
                  text-align: center
            }

            .template {
                  width: 100%;
                  height: 100%;
                  display: grid;
                  place-content: center
            }

            .player_By__Design {
                  width: 66.2rem;
                  height: 40.4rem;
                  position: relative;
                  background: var(--black-300)
            }

            .player_By__Design:before {
                  width: 60%;
                  height: 5rem;
                  border-radius: 50%;
                  background: #000;
                  left: 20%;
                  bottom: 0;
                  transform: translateY(50%);
                  filter: blur(30px);
                  opacity: .6;
                  z-index: -1
            }

            .background,
            .content {
                  width: 100%;
                  height: 100%
            }

            .content {
                  position: relative
            }

            .background {
                  position: absolute;
                  top: 0;
                  left: 0;
                  background-image: url(https://i.imgur.com/C66lcMH.jpg);
                  background-size: cover;
                  background-position: center center
            }

            .background:before {
                  width: 100%;
                  height: 100%;
                  background: rgba(0, 0, 0, .6);
                  top: 0;
                  left: 0
            }

            .main {
                  position: relative;
                  width: 100%;
                  height: 32.4rem;
                  gap: 2rem
            }

            .main_left {
                  flex: 1
            }

            .main_left__top {
                  width: 100%;
                  height: 12rem;
                  padding-top: 2.5rem
            }

            .station_title {
                  padding-left: 2.5rem;
                  font-size: 2.5rem;
                  font-weight: 600;
                  color: var(--primary)
            }

            .server_data {
                  width: 16rem;
                  height: 3.2rem;
                  align-items: center;
                  justify-content: center;
                  background: var(--primary);
                  text-transform: uppercase;
                  font-size: 1.4rem;
                  gap: 1rem
            }

            .date {
                  padding-left: 2.5rem;
                  margin-top: 7rem
            }

            .date_clock {
                  align-items: flex-end
            }

            .date_clock__hours {
                  font-size: 7rem;
                  line-height: 100%;
                  font-weight: 200
            }

            .date_clock__ampm {
                  font-size: 2rem;
                  padding-bottom: .2rem
            }

            .date_str {
                  font-size: 1.4rem;
                  font-weight: 600
            }

            .main_right {
                  width: 28rem;
                  align-items: center;
                  justify-content: center;
                  flex-direction: column
            }

            .cover_large {
                  width: 20rem;
                  height: 20rem;
                  background: transparent
            }

            .cover_large__bg {
                  width: 20rem;
                  height: 20rem;
                  background-image: url(https://i.imgur.com/yKE9IIQ.jpg);
                  background-size: cover;
                  background-repeat: no-repeat;
                  background-position: center center
            }

            .volume_control {
                  margin-top: 2rem;
                  width: 20rem;
                  gap: .5rem;
                  height: 3rem;
                  align-items: center
            }

            .volume_icon,
            .volume_icon i {
                  width: 2rem;
                  height: 2rem;
                  color: var(--primary)
            }

            .volume_icon i {
                  font-size: 2.0rem
            }

            .volume_progress {
                  flex: 1;
                  height: 3rem;
                  position: relative
            }

            .volume_progress_bar {
                  position: absolute;
                  width: 100%;
                  height: .6rem;
                  background: var(--black-300);
                  top: calc(50% - .3rem);
                  left: 0
            }

            .progress_bar__inner {
                  width: 100%;
                  height: 100%;
                  background: var(--primary)
            }

            .volume {
                  appearance: none;
                  width: 100%;
                  height: .6rem;
                  position: absolute;
                  top: calc(50% - .3rem);
                  border: none;
                  outline: 0;
                  cursor: pointer;
                  background: 0 0
            }

            .volume::-webkit-slider-thumb {
                  appearance: none;
                  width: 0;
                  height: 0;
                  border: none;
                  outline: 0;
                  background: 0 0
            }

            .volume::-moz-range-thumb {
                  appearance: none;
                  width: 0;
                  height: 0;
                  border: none;
                  outline: 0;
                  background: 0 0
            }

            .footer {
                  height: 8rem;
                  width: 100%;
                  background: var(--black-100);
                  position: relative;
                  overflow: hidden
            }

            .cover_small {
                  width: 8rem;
                  height: 8rem;
                  background: var(--black-100)
            }

            .cover_small_bg {
                  width: 8rem;
                  height: 8rem;
                  background-image: url(https://i.postimg.cc/Jn78dvp0/image-default-disc.jpg);
                  background-size: cover;
                  background-repeat: no-repeat;
                  background-position: center center
            }

            .pause,
            .pause i,
            .play,
            .play i,
            .play_pause {
                  width: 8rem;
                  height: 8rem
            }
			
			.play i,
            .pause i {
      font-size: 5.0rem; /* ajustabil */
      line-height: 8rem;
	  margin-left: 2rem;
}

            .play_pause {
                  background: var(--black-200);
                  cursor: pointer;
                  overflow: hidden
            }

            .play_pause:hover i {
                  color: var(--light);
                  transition: .2s
            }

            .pause,
            .play {
                  transition: .2s ease-in-out
            }

            .play_pause.playing .play {
                  margin-top: -8rem
            }

            .pause i,
            .play i {
                  font-size: 6rem;
                  color: var(--primary)
            }

            .nowplaying {
                  width: 50.2rem;
                  flex: 1;
                  height: 8rem;
                  flex-direction: column;
                  justify-content: center;
                  padding: 1.5rem
            }

            .nowplaying_slide__inner {
                  width: fit-content;
                  position: relative;
                  animation: slide_txt 20s linear infinite
            }

            .nowplaying_title {
                  text-transform: uppercase;
                  font-size: 1.2rem;
                  color: var(--primary);
                  font-weight: 600;
                  padding-left: -1rem
            }

            .nowplaying_slide {
                  height: 3.2rem;
                  width: 100%;
                  overflow: hidden
            }

            .nowplaying_slide__track {
                  width: fit-content;
                  min-width: 50.2rem;
                  height: 3.2rem;
                  line-height: 3.2rem;
                  font-size: 2.4rem;
                  font-weight: 600;
                  white-space: nowrap
            }

            @keyframes slide_txt {
                  100% {
                        transform: translateX(-50%)
                  }
            }
			
			
			.volume_percent {
      font-size: 1.4rem;
      font-weight: 600;
      width: 4rem;
      text-align: center;
      color: var(--primary);
      transition: color 0.2s linear;
	   margin-left: 1rem;
}
      </style>
</head>

function getClock() {

      var lang = navigator.languages,
            date = new Date,

const primary = [0, 180, 255];
const black400 = [218, 0, 0];
const light = [255, 255, 255];

function lerpColor(a, b, t) {
      return [
            Math.round(a[0] + (b[0] - a[0]) * t),
            Math.round(a[1] + (b[1] - a[1]) * t),
            Math.round(a[2] + (b[2] - a[2]) * t)
      ];
}

function rgbToHex(rgb) {
      return "#" + rgb.map(x => x.toString(16).padStart(2, "0")).join("");
}

btnVolume.addEventListener("input", function () {

      let value = parseInt(this.value, 10);

      audio.volume = value / 100;

      progress.style.width = value + "%";

      volumeText.textContent = value + "%";

let t = value / 100;
let rgb;

if (t <= 0.5) {
      // 0% -> 50% (black400 -> light)
      rgb = lerpColor(black400, light, t * 2);
} else {
      // 50% -> 100% (light -> primary)
      rgb = lerpColor(light, primary, (t - 0.5) * 2);
}

let color = rgbToHex(rgb);
volumeText.style.color = color;
