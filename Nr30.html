<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>ByDesign</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --rainbow: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            --accent: #ff0000; 
            --glow: 0 0 15px var(--accent), 0 0 25px var(--accent);
            --alien-gold: linear-gradient(to bottom, #fcf6ba 0%, #bf953f 50%, #fcf6ba 100%);
            --beat: 1;
        }
        body { background: transparent !important; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Arial Black', sans-serif; overflow: hidden; }
        
        .main-chassis {
            position: relative; width: 800px; height: 680px;
            background: radial-gradient(circle at center, #1a1a20 0%, #050505 100%);
            border-radius: 30px; padding: 25px;
            display: grid; grid-template-columns: 200px 1fr 200px; gap: 15px;
            border: 3px solid var(--accent);
            box-shadow: 0 0 40px var(--accent), inset 0 0 60px #000;
            z-index: 1; box-sizing: border-box;
            transition: border-color 0.4s;
        }

.console-center {
    position: absolute;
    top: 120px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2000; /* 🔥 peste tot */
}

        
        /* 🚀 RETRANGOLO SOCIAL MAGIC 🚀 */
        .magic-btn { 
            background: var(--accent); color: #fff; border: 2px solid #fff; 
            width: 250px; height: 35px; border-radius: 10px; font-size: 12px; cursor: pointer; 
            font-weight: bold; box-shadow: var(--glow); text-transform: uppercase;
            transition: 0.3s;
        }

        .magic-circles { display: flex; gap: 5px; margin-top: 5px; justify-content: center; width: 270px; flex-wrap: wrap; }
        .circle { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; transition: 0.3s; box-shadow: 0 0 5px #000; }
        .circle:hover { transform: scale(1.2); box-shadow: 0 0 10px #fff; }

.eq-container {
    height: 72px;
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    background: rgba(0,0,0,0.5);
    border: 2px solid var(--accent);
    border-radius: 12px;
    padding: 5px;
    box-sizing: border-box;
    box-shadow: var(--glow);
    margin-top: 2px; /* 🔹 adaugat pentru a-l coborî */
    margin-bottom: 10px;
}


.bar {
    width: 6px;
    border-radius: 2px 2px 0 0;
    transition: height 0.05s ease, background 0.3s;
    background: linear-gradient(to top, var(--accent) 50%, rgba(255,255,255,0.3) 100%);
}

        .social-vertical { display: none; flex-direction: column; gap: 25px; align-items: center; justify-content: center; height: 230px; width: 100%; }
        .social-link { color: var(--accent); font-size: 38px; text-shadow: var(--glow); transition: 0.3s; }

        .woofer-container { display: flex; justify-content: center; align-items: center; margin-top: -15px; margin-bottom: 20px; }
        .woofer { 
            width: 115px; height: 115px; border-radius: 50%; 
            background: radial-gradient(circle at center, #002b36 0%, #000 70%, #1a1a1a 100%); 
            border: 6px solid #151515; box-shadow: 0 0 30px var(--accent), inset 0 0 20px #000;
            display: flex; align-items: center; justify-content: center; 
            transform: scale(var(--beat)); transition: transform 0.05s ease-out; position: relative;
        }
        .woofer::after { content: ''; position: absolute; width: 35px; height: 35px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, var(--accent) 0%, #000 100%); box-shadow: 0 0 10px var(--accent); }

        .turntable { position: relative; display: flex; justify-content: center; align-items: center; margin-top: 50px; }
        .vinyl { width: 310px; height: 310px; border-radius: 50%; border: 8px solid #0a0a0a; outline: 2px solid var(--accent); box-shadow: 0 0 40px var(--accent); overflow: hidden; background: #000; position: relative; z-index: 5; }
        .album-cover { width: 100%; height: 100%; background-size: cover; background-position: center; transition: 800ms; background-image: url('https://xatimg.com/image/oacvd5ltA14X.png'); }
        .playing .album-cover { animation: spin 5s linear infinite; }

        .arm { position: absolute; width: 110px; height: 260px; right: -70px; top: -10px; background: url('https://xatimg.com/image/XJhVjJdCs2bN.gif'); background-size: contain; background-repeat: no-repeat; transform-origin: 85% 10%; transform: rotate(-5deg); transition: 1.5s cubic-bezier(0.45, 0.05, 0.55, 0.95); z-index: 100; pointer-events: none; }
        .playing .arm { transform: rotate(14deg); }

        .display-top { grid-column: 1 / 4; height: 75px; background: rgba(0,0,0,0.9); border: 3px solid var(--accent); border-radius: 15px; overflow: hidden; position: relative; display: flex; align-items: center; box-shadow: 0 0 20px var(--accent); }
        .marquee-box { display: flex; width: 100%; white-space: nowrap; animation: full-scroll 15s linear infinite; }
.rainbow-text {
    font-size: 28px;
    font-weight: 900;
    text-transform: uppercase;
    color: var(--accent);
    text-shadow: none; /* 🔥 scoate complet glow */
    padding: 0 50px;
}
        .box { background: rgba(0, 242, 255, 0.05); border: 2px solid var(--accent); border-radius: 12px; padding: 10px; text-align: center; height: 68px; display: flex; flex-direction: column; justify-content: center; width: 100%; box-shadow: var(--glow); margin-bottom: 10px; box-sizing: border-box; overflow: hidden; }
        .box h4 { margin: 0; font-size: 9px; color: #bf953f; text-transform: uppercase; }
.box span {
    font-size: 11px;
    font-weight: bold;
    color: var(--accent);
    text-shadow: 0 0 5px #000, 0 0 10px var(--accent);
}

        .control-bar { grid-column: 1 / 4; display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.9); border-radius: 50px; padding: 12px 35px; border: 3px solid var(--accent); box-shadow: 0 0 25px var(--accent); position: relative; z-index: 100; }
.btn-action {
    background: var(--accent);
    color: #fff; /* default text */
    border: 2px solid #fff;
    padding: 10px 25px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: var(--glow);
    transition: 0.3s;
}     
   
.volume-slider {
    -webkit-appearance: none;
    width: 150px;
    height: 12px;
    border-radius: 6px;
    border: 1px solid var(--accent);
    outline: none;
    cursor: pointer;
    transition: background 0.3s, box-shadow 0.3s;
    background: linear-gradient(to right, var(--accent) 100%, rgba(255,255,255,0.1) 100%);
}

/* Track pentru Firefox */
.volume-slider::-moz-range-track {
    background: rgba(255,255,255,0.1);
    border-radius: 6px;
    border: 1px solid var(--accent);
}

/* Thumb */
.volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #fff;
    box-shadow: 0 0 8px var(--accent);
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.2s ease;
}

.volume-slider::-webkit-slider-thumb:hover {
    transform: scale(1.2);
    box-shadow: 0 0 12px var(--accent);
}

/* Firefox Thumb */
.volume-slider::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #fff;
    box-shadow: 0 0 8px var(--accent);
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.2s ease;
}

.volume-slider::-moz-range-thumb:hover {
    transform: scale(1.2);
    box-shadow: 0 0 12px var(--accent);
}


.magic-history {
    position: absolute;
    top: 82px; 
    left: 50%;
    transform: translateX(-50%) scale(1) !important; /* corectat punct și virgulă */
    width: 450px;
    max-height: 300px;     /* lungimea maximă dorită */
    overflow-y: auto;      /* scrollbar dacă depășește max-height */
    background: rgba(0,0,0,0.95);
    border: 2px solid var(--accent);
    border-radius: 12px;
    box-shadow: 0 0 20px var(--accent);
    padding: 10px;
    display: none;
    flex-direction: column;
    gap: 8px;
    z-index: 1000;
    transition: none; /* elimină orice transform/scale animat */
    pointer-events: auto;
}

.history-item {
    display: flex;
    flex-direction: column;
	padding: 8px 10px;   /* mai mult spațiu în interior */
    margin-bottom: 5px;   /* spațiu între itemi */
}

.history-item .row {
    display: flex;
    align-items: center;
    gap: 8px;
}

.history-item .num {
    color: var(--accent);
    font-weight: bold;
    min-width: 20px;
}

.history-item .title {
    color: #fff;
    font-weight: bold;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.history-item .bar {
    height: 4px;
    background: var(--accent);
    border-radius: 2px;
    margin-top: 2px;
    width: 0%;
    transition: width 0.5s ease;
}

/* Arată dropdown la hover */
.console-center:hover #history-dropdown {
    display: none;
}

#history-btn:hover ~ #history-dropdown,
#history-dropdown:hover {
    display: flex;
}







        /* 🌈 ANIMAZIONI AGGIORNATE 🌈 */

}
    </style>

<script type="text/javascript">
(function($){
    "use strict";
    $.fn.icast = function(options){
        var settings = $.extend({ URL: "https://radio.sonicpanel.ro:10922", streampath: "/stream" }, options);
        var audio = new Audio(); 
        audio.crossOrigin = "anonymous";

        let audioCtx, analyser, dataArray, source;

        function initViz() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser); 
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 64; 
                dataArray = new Uint8Array(analyser.frequencyBinCount);

function draw() { 
    requestAnimationFrame(draw); 
    analyser.getByteFrequencyData(dataArray); 
    let low = dataArray[2]; 
    let beat = 1 + (low / 800); 
    document.documentElement.style.setProperty('--beat', beat); 

    // doar EQ-ul
    let bars = document.querySelectorAll('.eq-container .bar');
    for (let i = 0; i < bars.length; i++) {
        let height = dataArray[i * 2] * 0.25;
        bars[i].style.height = (height < 5 ? 5 : height) + 'px';
    }
}
                draw();
            }
        }

        $(".play-trigger").on("click", function(){ 
            audio.src = settings.URL + settings.streampath; 
            initViz(); 
            audio.play(); 
            $("#ByDesign").addClass("playing"); 
        });

        $(".stop-trigger").on("click", function(){ 
            audio.pause(); 
            audio.src = ""; 
            $("#ByDesign").removeClass("playing"); 
            document.querySelectorAll('.bar').forEach(b => b.style.height = '5px');
        });

        // === Slider + procent volum ===
        const volumeSlider = document.querySelector('.volume-slider');
        const volumePercent = document.getElementById('volume-percent');

        function updateVolumeSliderTrack(slider) {
            let val = slider.value;
            slider.style.background = `linear-gradient(to right, var(--accent) 0%, var(--accent) ${val}%, rgba(255,255,255,0.1) ${val}%, rgba(255,255,255,0.1) 100%)`;
            volumePercent.innerText = val + "%";
        }

        updateVolumeSliderTrack(volumeSlider);

        volumeSlider.addEventListener('input', () => {
            audio.volume = volumeSlider.value / 100;
            updateVolumeSliderTrack(volumeSlider);
        });

        // === Scrool melodie / artist ===
        function getSH(url){
            $.ajax({ type: 'GET', dataType: 'html', url: url, success: function(data){ 
                var result = $.parseHTML(data)[0].data; 
                var parts = result.split(",");
                var songtitle = parts.length > 6 ? parts[6] : "";

                if (songtitle && songtitle.trim() !== "" && songtitle.trim() !== "-") {
                    var splitSong = songtitle.split('-');

                    var artist = splitSong[0] ? splitSong[0].trim() : "---";
                    var song = splitSong[1] ? splitSong[1].trim() : "---";

                    $(".artist-name").text(artist);
                    $(".songtitle-box").text(song || songtitle);

const currentSong = artist + " - " + song;

if (currentSong !== lastSong) {
    addToHistory(artist, song);
    lastSong = currentSong;
}
                } else {
                    $(".artist-name").text("---");
                    $(".songtitle-box").text("N/A");
                }

                if (songtitle && songtitle.trim() !== "" && songtitle.trim() !== "-") {
                    var parts = songtitle.split('-');
                    var artist = parts[0] ? parts[0].trim() : "---";
                    var song = parts[1] ? parts[1].trim() : "---";

                    $(".artist-name").text(artist); 
                    $(".songtitle-box").text(song);

                    let stylizedByDesign = "".replace(/O/g, '❤️');
                    $("#scroll-text").html(stylizedByDesign + '• • • ♫ • • • Radio LaFamilia • • • ♫ • • • ' + songtitle.toUpperCase());

                    if(artist.toUpperCase().includes("WJ") || artist.toUpperCase().includes("DJ")) {
                        $("#dj-container").show();
                        $("#live-monitor").html(artist.toUpperCase() + " ⭐ " + song.toUpperCase());
                        getCover(artist, song, true);
                    } else {
                        $("#dj-container").hide();
                        getCover(artist, song, false);
                    }
                }
            }});
        }

        function getCover(artist, song, isDJ){ 
            $.getJSON("-https://francobollo10.github.io/xat/dj-ByDesign.json", function(data){ 
                let foundDJ = false; 
                for(let dj in data){ 
                    if(artist.toLowerCase().includes(dj.toLowerCase())){ 
                        $(".album-cover").css('background-image', 'url('+data[dj]+')'); 
                        foundDJ = true; break; 
                    } 
                } 
                if(!foundDJ && !isDJ) { 
                    fetchiTunesCover(artist + " " + song); 
                } else if (!foundDJ && isDJ) { 
                    $(".album-cover").css('background-image', 'url(https://xatimg.com/image/oacvd5ltA14X.png)'); 
                } 
            }); 
        }

        function fetchiTunesCover(term){ 
            $.getJSON("https://itunes.apple.com/search?term="+encodeURIComponent(term)+"&limit=1", function(data){ 
                if(data.results.length > 0){ 
                    var url = data.results[0].artworkUrl100.replace("100x100","600x600"); 
                    $(".album-cover").css('background-image', 'url('+url+')'); 
                } else { 
                    $(".album-cover").css('background-image', 'url(https://xatimg.com/image/oacvd5ltA14X.png)'); 
                } 
            }); 
        }

        setInterval(() => getSH(settings.URL + "/7.html"), 25000); 
        getSH(settings.URL + "/7.html");
    };
})(jQuery);

// === inițializează icast pe div corect ===
$("#ByDesign").icast();

// === changeTheme curățată și funcțională ===
function changeTheme(color) {
    document.documentElement.style.setProperty('--accent', color);

    // Update slider
    const slider = document.querySelector('.volume-slider');
    let val = slider.value;
    slider.style.background = `linear-gradient(to right, ${color} 0%, ${color} ${val}%, rgba(255,255,255,0.1) ${val}%, rgba(255,255,255,0.1) 100%)`;

    // Update EQ bars
    document.querySelectorAll('.bar').forEach(bar => {
        bar.style.background = `linear-gradient(to top, ${color} 90%, rgba(255,255,255,0.3) 100%)`;
    });

    // Butoane
    let isLight = ["#ffffff", "#ffd700", "#fffb00"].includes(color);
    document.querySelectorAll('.btn-action, .magic-btn').forEach(btn => {
        btn.style.color = isLight ? "#000" : "#fff";
        btn.style.border = isLight ? "2px solid #000" : "2px solid #fff";
    });
}

// === istoric melodii ===
let lastSong = "";
// === istoric melodii ===
let historyList = []; // inițial gol

async function loadHistoryAndCurrent() {
    try {
        let response = await fetch("https://radio.sonicpanel.ro:10922/played?sid=1&type=json");
        let data = await response.json();

        const items = document.querySelectorAll('#history-dropdown .history-item');

        // === 5 melodii în istoric ===
        data.slice(0,5).forEach((track, index) => {
            if(items[index]){
                items[index].querySelector('.title').innerText = track.title || "-----";
                items[index].querySelector('.bar').style.width = '100%';
            }
        });

        for(let i = data.length; i < 5; i++){
            if(items[i]){
                items[i].querySelector('.title').innerText = "-----";
                items[i].querySelector('.bar').style.width = '0%';
            }
        }

        // === melodia curentă în scroll ===
        if(data.length > 0){
            let current = data[0].title; // primul track = melodia curentă
            $("#scroll-text").text("• • • ♫ • • • Radio LaFamilia • • • ♫ • • • " + current.toUpperCase());
            
            // poți actualiza și artist / song box
            let split = current.split(" - ");
            $(".artist-name").text(split[0] ? split[0].trim() : "---");
            $(".songtitle-box").text(split[1] ? split[1].trim() : current);
        }

    } catch(e){
        console.log("History error", e);
    }
}

// === F5 și periodic ===
loadHistoryAndCurrent();
setInterval(loadHistoryAndCurrent, 25000); // update la fiecare 25s

// === Magic toggle ===
function activateMagic() { 
    $(".box, .eq-container").toggle(); 
    $(".social-vertical").toggle(); 
}

// === Clock + Date ===
setInterval(() => { 
    let now = new Date(); 
    document.getElementById('Clock').innerText = now.toLocaleTimeString('it-IT'); 
    document.getElementById('data').innerText = now.toLocaleDateString('it-IT'); 
}, 1000);

// === Horoscope ===
function updateHoroscope() { 
    const signs = [{name: "PESCI", icon: "♓"}]; 
    const sign = signs[0]; 
    document.getElementById("horoscope-text").innerHTML = `${sign.icon} ${sign.name}<br>FORTUNA ⭐⭐⭐`; 
}
updateHoroscope();

// === Meteo ===
function getMeteo() { 
    $.getJSON("https://ipapi.co/json/", function(loc) { 
        $.getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current_weather=true`, function(data) { 
            document.getElementById("meteo-info").innerText = `${loc.city.toUpperCase()}: ${Math.round(data.current_weather.temperature)}°C`; 
        }); 
    }); 
}
getMeteo();

// === Geolocație ===
function fetchGeo() { 
    $.getJSON('https://ipinfo.io/?callback=?', function(data) { 
        document.getElementById('v_city').innerText = data.city.toUpperCase(); 
    }); 
}
fetchGeo();



// --- PROTECT SCRIPT ---


document.addEventListener("contextmenu", e => e.preventDefault());

document.onkeydown = function(e) {

if(e.keyCode == 123) return false; // F12

if(e.ctrlKey && e.shiftKey && e.keyCode == 73) return false; // CTRL+SHIFT+I

if(e.ctrlKey && e.shiftKey && e.keyCode == 74) return false; // CTRL+SHIFT+J

if(e.ctrlKey && e.keyCode == 85) return false; // CTRL+U

};
</script>
