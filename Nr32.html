<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>ByDesign</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { 
            --rainbow-speed: 2s; 
            --neon-intensity: 20px;
        }
         body {
            margin: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            background: #000; 
            color: white; 
            font-family: 'Arial', sans-serif; 
            overflow: hidden;
            padding: 10px;
        }
        .ByDesign {
            font-size: 26px; 
            font-weight: bold; 
            margin-bottom: 20px; 
            padding: 8px 35px; 
            border: 4px solid; 
            border-radius: 12px; 
            text-align: center;
            text-transform: uppercase;
            animation: neon-flash var(--rainbow-speed) linear infinite;
        }
        @keyframes neon-flash {
            0%, 100% { 
                border-color: #ff0000; 
                box-shadow: 0 0 5px #ff0000, 0 0 25px #ff0000, inset 0 0 10px #ff0000; 
                color: #fff;
                text-shadow: 0 0 10px #ff0000;
            }
            33% { 
                border-color: #00ff00; 
                box-shadow: 0 0 5px #00ff00, 0 0 25px #00ff00, inset 0 0 10px #00ff00; 
                color: #fff;
                text-shadow: 0 0 10px #00ff00;
                opacity: 0.9;
            }
            35% { opacity: 1; } 
            66% { 
                border-color: #00ffff; 
                box-shadow: 0 0 5px #00ffff, 0 0 25px #00ffff, inset 0 0 10px #00ffff; 
                color: #fff;
                text-shadow: 0 0 10px #00ffff;
            }
        }
        .main-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }
        .side-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .info-cube {
            width: 110px;
            height: 90px;
            border: 3px solid;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: neon-flash var(--rainbow-speed) linear infinite;
            background: rgba(0, 0, 0, 0.5);
        }
		
		
		.info-cube,
            #marqueeContainer,
            .bottom-player,
            .central-hub
			.wheel-container,
			.wheel-base,
            .ByDesign {
             background: rgba(0, 0, 0, 0.5);
			 backdrop-filter: blur(5px);
        }
		
		.cube-value a:hover {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }
		
        .cube-label { font-size: 10px; letter-spacing: 2px; margin-bottom: 3px; font-weight: bold; }
        .cube-value { font-size: 15px; font-weight: bold; text-align: center; }
        .center-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        #marqueeContainer {
            width: 450px; 
            height: 40px; 
            overflow: hidden;
            border: 3px solid; 
            border-radius: 20px;
            display: flex; 
            align-items: center; 
            animation: neon-flash var(--rainbow-speed) linear infinite;
        }
        #marquee {
            display: inline-block; 
            white-space: nowrap; 
            animation: scroll 10s linear infinite;
            font-size: 18px; 
            font-weight: bold;
        }
        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .wheel-container {
            width: 280px;
            height: 280px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .wheel-base {
            width: 100%;
            height: 100%;
            border: 4px solid #333;
            border-radius: 50%;
            position: absolute;
            animation: rotate-wheel 15s linear infinite;
            z-index: 1;
        }
		
		.wheel-base {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        } 
        .cover-slot {
            position: absolute;
            width: 65px;
            height: 65px;
            border: 2px solid #fff;
            border-radius: 8px;
            background-size: cover;
            background-position: center;
            z-index: 2;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }
        .central-hub {
            position: absolute;
            width: 110px;
            height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: #000;
            border-radius: 50%;
            border: 4px solid; 
            animation: neon-flash var(--rainbow-speed) linear infinite;
        }
        .profile-img {
            width: 100%;
            height: 100%; 
            border-radius: 50%; 
            background-image: url('https://xatimg.com/image/oacvd5ltA14X.png');
            background-size: cover;
            background-position: center;
            animation: rotate-hub 5s linear infinite; 
        }
        @keyframes rotate-wheel { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes rotate-hub { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .bottom-player {
            margin-top: 30px;
            width: 650px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px; 
            padding: 15px;
            border-radius: 50px;
            border: 4px solid;
            animation: neon-flash var(--rainbow-speed) linear infinite;
        }
        .btn-ctrl {
            background: rgba(255,255,255,0.1);
            border: 2px solid #fff;
            padding: 10px 30px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            font-size: 16px;
            transition: 0.3s;
            text-shadow: 0 0 5px #fff;
        }
        .btn-ctrl:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 20px #fff;
        }


input[type=range] {
    -webkit-appearance: none;
    width: 200px;
    height: 10px;
    border-radius: 10px;
    outline: none;
    background: rgba(0,0,0,0.7);
    box-shadow: inset 0 0 10px #000;
}

/* TRACK */
input[type=range]::-webkit-slider-runnable-track {
    height: 10px;
    border-radius: 10px;

    background: linear-gradient(
        90deg,
        #ff0000,
        #ff00ff,
        #00ffff,
        #00ff00,
        #ffff00,
        #ff0000
    );

    background-size: 400% 100%;
    animation: neonFlow 3s linear infinite;

    box-shadow:
        0 0 10px rgba(0,255,255,0.5),
        0 0 20px rgba(255,0,255,0.3);
}

@keyframes neonFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 400% 50%; }
}

/* THUMB */
input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    margin-top: -6px;

    animation: thumbGlow 2s linear infinite;
    transition: transform 0.2s ease;
}

@keyframes thumbGlow {
    0% {
        box-shadow: 0 0 8px #ff0000, 0 0 20px #ff0000;
    }
    33% {
        box-shadow: 0 0 8px #00ff00, 0 0 20px #00ff00;
    }
    66% {
        box-shadow: 0 0 8px #00ffff, 0 0 20px #00ffff;
    }
    100% {
        box-shadow: 0 0 8px #ff0000, 0 0 20px #ff0000;
    }
}

@keyframes thumbColorMove {
    0% {
        background-position: 0% 50%;
        filter: hue-rotate(0deg);
    }
    50% {
        background-position: 100% 50%;
        filter: hue-rotate(180deg);
    }
    100% {
        background-position: 0% 50%;
        filter: hue-rotate(360deg);
    }
}

input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.3);
    box-shadow:
        0 0 12px #ffffff,
        0 0 25px #00ffff,
        0 0 45px #ff00ff;
}

input[type=range] {
    position: relative;
}

@keyframes eqMove {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
}

#sonic_listeners {
    color: #fff;
    font-size: 26px;
    font-weight: bold;
    text-shadow:
        0 0 10px #00ffff,
        0 0 20px #ff00ff,
        0 0 30px #00ff00;
    animation: pulseLive 1.5s infinite;
}

@keyframes pulseLive {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

#sonic_listeners,
#sonic_js,
iframe[src*="sonicpanel"],
div[id*="info-cube"] {
    color: #ffffff !important;
    background: transparent !important;
    filter: none !important;
    text-shadow: none !important;
}


</style>
</head>
<body>

    <div class="ByDesign">𝕽𝖆𝖉𝖎𝖔 𝕷𝖆𝕱𝖆𝖒𝖎𝖑𝖎𝖆</div>

    <div class="main-layout">
        <div class="side-column">
            <div class="info-cube">
                <div class="cube-label" style="text-decoration: underline;">DATA</div>
                <div id="date" class="cube-value">--/--/----</div>
            </div>
            <div class="info-cube">
                <div class="cube-label" style="text-decoration: underline;">ORA</div>
                <div id="clock" class="cube-value">00:00:00</div>
            </div>
        </div>

        <div class="center-column">
            <div id="marqueeContainer">
                <div id="marquee">Încărcare...</div>
            </div>
            <div class="wheel-container">
                <div class="wheel-base" id="MjcxMDU0"></div>
                <div class="central-hub">
                    <div class="profile-img"></div>
                </div>
            </div>
        </div>

        <div class="info-cube" style="height: 195px;">
    <div class="cube-label"></div>

    <div class="cube-value" style="font-size: 13px; display:flex; flex-direction:column; gap:20px;">

        <a href="https://facebook.com" target="_blank" style="color:white;text-decoration:none;">
            <i class="fab fa-facebook fa-2x"></i>
        </a>

        <a href="https://google.com" target="_blank" style="color:white;text-decoration:none;">
            <i class="fas fa-globe fa-2x"></i>
        </a>

        <a href="https://play.google.com" target="_blank" style="color:white;text-decoration:none;">
            <i class="fab fa-google-play fa-2x"></i>
        </a>

        <a href="https://radio.sonicpanel.ro/lafamilia/stream" target="_blank" style="color:white;text-decoration:none;">
            <i class="fas fa-music fa-2x"></i>
        </a>

    </div>
</div>
    </div>

    <div class="bottom-player">
        <button class="btn-ctrl" id="playBtn" onclick="togglePlay()">PLAY</button>
        <input type="range" id="vol" min="0" max="1" step="0.1" value="1" oninput="setVol(this.value)">
		<div style="color:white;font-size:11px;font-weight:bold;text-shadow:1px 1px 2px #000;margin-top:5px;display:flex;justify-content:center;gap:6px;align-items:center;">
            <span>VOLUM</span>
            <span id="volPercent">100%</span>
            </div>
   <div class="cube-label">LIVE🎧<div style="font-size:22px; font-weight:bold; text-shadow:0 0 10px #00ffff;"></div>
    <script id='sonic_js' data-port='8132' src='https://radio.sonicpanel.ro/cp/widgets.js?r=674'></script>
    <center><div id='sonic_listeners' style="font-size:18px; font-weight:bold; text-shadow:0 0 10px #00ffff;"></div></center>
	</div>
	<div class="cube-label">BPM🎵<div style="font-size:22px; font-weight:bold; text-shadow:0 0 10px #00ffff;"></div>
    <center><div id='sonic_bitrate' style="font-size:18px; font-weight:bold; text-shadow:0 0 10px #00ffff;"></div></center>
        <audio id="audioPlayer" src="https://radio.sonicpanel.ro:10922/stream" crossorigin="anonymous"></audio>
    </div>
	</div>

    <script>
        const defaultImg = "https://xatimg.com/image/oacvd5ltA14X.png";
        const wheel = document.getElementById('MjcxMDU0');
        const player = document.getElementById('audioPlayer');
        let lastSong = "";
		let currentListeners = 0;
        let lastListeners = 0;
		

        for (let i = 0; i < 8; i++) {
            let angle = (i * 360) / 8;
            let slot = document.createElement('div');
            slot.className = 'cover-slot';
            slot.style.backgroundImage = `url('${defaultImg}')`;
            let radius = 105; 
            let x = Math.cos(angle * Math.PI / 180) * radius;
            let y = Math.sin(angle * Math.PI / 180) * radius;
            slot.style.left = `calc(50% + ${x}px - 32.5px)`;
            slot.style.top = `calc(50% + ${y}px - 32.5px)`;
            slot.style.transform = `rotate(${angle + 90}deg)`;
            wheel.appendChild(slot);
        }
		function updateVolumeUI(v) {
    let percent = Math.round(v * 100);
    document.getElementById("volPercent").innerText = percent + "%";
}



async function updateStats() {
    try {

        // 🔥 SONG INFO
        const res = await fetch("https://radio.sonicpanel.ro:10922/played?sid=1&type=json", {
            cache: "no-store"
        });

        const data = await res.json();

        console.log("SONIC PLAYED:", data);

        let artist = "";
        let title = "";

        if (data?.song) {
            if (typeof data.song === "string") {
                const parts = data.song.split(" - "); // FIX IMPORTANT
                artist = parts[0] || "";
                title = parts[1] || "";
            } else {
                artist = data.song.artist || "";
                title = data.song.title || "";
            }
        }
        else if (data?.artist || data?.title) {
            artist = data.artist || "";
            title = data.title || "";
        }
        else if (Array.isArray(data)) {
            artist = data[0]?.artist || "";
            title = data[0]?.title || "";
        }

        let song = `${artist} - ${title} 🔊`.trim();
        song = song.replace(/^-+\s*/, "");

        document.getElementById("marquee").innerText =
            song || "Radio LIVE 🔊";


        // 🔥 LISTENERS (ASCULTĂTORI)
        try {
            const statsRes = await fetch("https://radio.sonicpanel.ro:10922/stats?sid=1&type=json", {
                cache: "no-store"
            });

            const stats = await statsRes.json();

            let listeners = 0;

            if (stats?.listeners) {
                listeners = stats.listeners;
            }
            else if (stats?.currentlisteners) {
                listeners = stats.currentlisteners;
            }
            else if (stats?.data?.listeners) {
                listeners = stats.data.listeners;
            }

            const el = document.getElementById("listeners");

            if (el) {
                el.innerText = listeners;

                // mic efect glow/pulse când se schimbă
                if (listeners !== lastListeners) {
                    el.style.transform = "scale(1.2)";
                    el.style.textShadow = "0 0 20px #00ffff";

                    setTimeout(() => {
                        el.style.transform = "scale(1)";
                        el.style.textShadow = "none";
                    }, 300);

                    lastListeners = listeners;
                }
            }

        } catch (err) {
            console.log("LISTENERS ERROR:", err);
        }

    } catch (e) {
        console.log("ERROR:", e);
        document.getElementById("marquee").innerText = "Radio LIVE 🔊";
    }
}
        function togglePlay() {
            if (player.paused) { player.play(); document.getElementById('playBtn').innerText = "STOP"; }
            else { player.pause(); document.getElementById('playBtn').innerText = "PLAY"; }
        }

function setVol(v) {
    player.volume = v;
    updateVolumeUI(v);
}

        function updateTime() {
            const d = new Date();
            document.getElementById('date').innerText = d.toLocaleDateString('ro-RO');
            document.getElementById('clock').innerText = d.toLocaleTimeString();
        }
		
		
		
		const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const source = audioCtx.createMediaElementSource(player);
const analyser = audioCtx.createAnalyser();

source.connect(analyser);
analyser.connect(audioCtx.destination);

analyser.fftSize = 256;

const dataArray = new Uint8Array(analyser.frequencyBinCount);
const body = document.body;

function beatGlow() {
    requestAnimationFrame(beatGlow);

    analyser.getByteFrequencyData(dataArray);

    let sum = dataArray.reduce((a, b) => a + b, 0);
    let avg = sum / dataArray.length;

    // intensitate glow
    let glow = avg / 2;

    body.style.boxShadow = `
        inset 0 0 ${glow}px rgba(0,255,255,0.3),
        inset 0 0 ${glow * 2}px rgba(255,0,255,0.2)
    `;
}

beatGlow();

document.addEventListener("click", () => {
    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }
});
        
        setInterval(updateTime, 1000);
        setInterval(updateStats, 5000);
        updateTime();
        updateStats();
		updateVolumeUI(player.volume);
		
		
		
// --- PROTECT SCRIPT ---


document.addEventListener("contextmenu", e => e.preventDefault());

document.onkeydown = function(e) {

if(e.keyCode == 123) return false; // F12

if(e.ctrlKey && e.shiftKey && e.keyCode == 73) return false; // CTRL+SHIFT+I

if(e.ctrlKey && e.shiftKey && e.keyCode == 74) return false; // CTRL+SHIFT+J

if(e.ctrlKey && e.keyCode == 85) return false; // CTRL+U

};
</script>
</body>
</html>
