.track-marquee {
  width: 100%;
  overflow: hidden;
  white-space: nowrap;
  color: var(--cyan);
  font-size: 12px;
  font-weight: 900;
}

.track-marquee span {
  display: inline-block;
  padding-left: 100%;
  animation: marquee 15s linear infinite;
}

.artist-line {
  margin-top: 3px;
  font-size: 9px;
  color: #f0fbff;
  opacity: .92;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.status-line {
  margin-top: 3px;
  font-size: 8px;
  color: #9eefff;
  opacity: .8;
  letter-spacing: .8px;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.controls {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 300px;
  z-index: 3;
}

.btn {
  min-width: 54px;
  height: 29px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  font-weight: 800;
  color: #04111a;
  background: linear-gradient(180deg, #7ef8ff, #44c4ff);
  padding: 0 12px;
}

.btn.stop {
  background: linear-gradient(180deg, #ff8be5, #ff5fb5);
  color: #220714;
}

.btn.mute {
  background: linear-gradient(180deg, #ffe69a, #ffcb5f);
  color: #251800;
}

.volume {
  width: 120px;
  -webkit-appearance: none;
  appearance: none;
  height: 7px;
  background: rgba(255, 255, 255, .12);
  border-radius: 999px;
  border: 1px solid rgba(98, 243, 255, .2);
  outline: none;
}

.volume::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--cyan);
  cursor: pointer;
}

/* INFO PANEL */

.info-panel {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 50px;
  width: 480px;
  height: 44px;
  border-radius: 14px;
  background: rgba(0, 36, 68, 0.9);
  border: 2px solid var(--cyan);
  display: flex;
  align-items: center;
  justify-content: space-around;
  color: #ffffff;
  font-size: 13px;
  font-weight: 700;
  z-index: 4;
  box-shadow: 0 0 15px rgba(98,243,255,0.4);
}

.signal-dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-right: 6px;
  background: #00ff62;
  box-shadow: 0 0 10px #00ff62;
  animation: signalPulse 1.2s ease-in-out infinite;
  vertical-align: middle;
}

.signal-dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-right: 6px;
  background: #00ff62;
  box-shadow: 0 0 10px #00ff62;
}

/* FORȚEAZĂ SĂ NU APARĂ “AL DOILEA CERC” DIN FONT/LINE-HEIGHT */
#signalDot::before,
#signalDot::after {
  content: none !important;
  display: none !important;
}

.offline-dot {
  background: #ff3b3b !important;
  box-shadow: 0 0 10px #ff3b3b !important;
}

.muted-dot {
  background: #ffcb5f !important;
  box-shadow: 0 0 10px #ffcb5f !important;
}


#switchServer {      /* Modifucare pozitie box servare */
  position: absolute;
  top: 300px;     /* modifici după nevoie */
  left: 540px;    /* sau right */
  z-index: 10;
}


@keyframes switchFade {
  0% { opacity: 0; transform: translateY(6px) scale(0.96); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes glowPulse {
  0% { text-shadow: 0 0 0 rgba(98,243,255,0); }
  50% { text-shadow: 0 0 12px rgba(98,243,255,0.9); }
  100% { text-shadow: 0 0 0 rgba(98,243,255,0); }
}

.server-anim {
  animation: switchFade 0.4s ease, glowPulse 0.6s ease;
}

.planet-wrap.pulse {
  animation: floatPlanet 7s ease-in-out infinite, planetPulse 0.8s ease;
}

@keyframes cassettePulse {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.04); }
  100% { transform: scale(1); }
}

.cassette-wrap.pulse {
  animation: floatCassette 6.2s ease-in-out infinite, cassettePulse 0.7s ease;
}

<script>
const STREAMS = {
  server1: {
    stream: "https://radio.sonicpanel.ro:10922/stream/",
    info: "https://radio.sonicpanel.ro/cp/get_info.php?p=8132",
    name: " Play Radio RGV",
    radioName: "Radio LaFamilia"
  },
  server2: {
    stream: "https://radio.sonicpanel.ro:8104/stream/",
    info: "https://radio.sonicpanel.ro/cp/get_info.php?p=8104",
    name: "Play LaFamilia",
    radioName: "Radio RGV"
  }
};

let currentServer = STREAMS.server1;

const audio = new Audio(currentServer.stream);

    const playBtn = document.getElementById("playBtn");
    const stopBtn = document.getElementById("stopBtn");
    const muteBtn = document.getElementById("muteBtn");
    const cassette = document.getElementById("cassette");
    const trackMarquee = document.getElementById("trackMarquee");
    const artistName = document.getElementById("artistName");
    const volume = document.getElementById("volume");
	const volValue = document.getElementById("volValue");
	const switchBtn = document.getElementById("switchServer");
	const planetLabel = document.querySelector(".planet-label");
	const brandEl = document.querySelector(".brand");
	const planetWrap = document.getElementById("planetWrap");
	const cassetteWrap = document.querySelector(".cassette-wrap");
	
function updateServerUI() {
  switchBtn.innerText = currentServer.name;
  planetLabel.innerText = currentServer.radioName;
  brandEl.innerText = currentServer.radioName;

  // 🔥 trigger animație
planetWrap.classList.remove("pulse");
void planetWrap.offsetWidth;
planetWrap.classList.add("pulse");

cassetteWrap.classList.remove("pulse");
void cassetteWrap.offsetWidth; // reset animație
cassetteWrap.classList.add("pulse");

  void planetLabel.offsetWidth; // reset animație
  void brandEl.offsetWidth;

  planetLabel.classList.add("server-anim");
  brandEl.classList.add("server-anim");
}


switchBtn.onclick = () => {

  if (currentServer === STREAMS.server1) {
    currentServer = STREAMS.server2;
  } else {
    currentServer = STREAMS.server1;
  }

  audio.pause();
  audio.src = currentServer.stream;
  audio.load();
  audio.play();

  updateServerUI(); // 🔥 AICI

  updateSongInfo();
  setStatus("online");
};
updateServerUI();



playBtn.onclick = () => {
  audio.muted = false;
  audio.play();

  cassette.classList.add("playing");
  updateSongInfo();
  setStatus("online");

  updateServerUI(); // 🔥
};

stopBtn.onclick = () => {
  audio.pause();
  audio.currentTime = 0;
  cassette.classList.remove("playing");
  trackMarquee.querySelector("span").innerText = "RADIO EN PAUSA";
  setStatus("offline");
};

muteBtn.onclick = () => {
  audio.muted = !audio.muted;

  if (audio.muted) {
    setStatus("muted");
  } else {
    setStatus("online");
  }
};


volume.oninput = (e) => {
const val = e.target.value;
audio.volume = val / 100;
volValue.innerText = val + "%";
};

audio.volume = volume.value / 100;
volValue.innerText = volume.value + "%";

    async function updateSongInfo() {
      try {
        const r = await fetch(currentServer.info + "&t=" + new Date().getTime());
        const data = await r.json();
        if (data.title) {
          let partes = data.title.split(" - ");
          trackMarquee.querySelector("span").innerText = (partes[1] || data.title).toUpperCase();
          artistName.innerText = (partes[0] || "Radio LaFamilia").toUpperCase();
        }
        if (data.art) document.getElementById('coverImg').src = data.art;
        if (data.listeners) document.getElementById('listenersEl').innerText = data.listeners + " Listen";
      } catch (e) { console.log(e); }
    }

    function updateDateTime() {
      const n = new Date();
      document.getElementById("dateEl").innerText = n.toLocaleDateString();
      document.getElementById("timeEl").innerText = n.toLocaleTimeString();
    }
    setInterval(updateDateTime, 1000);
    setInterval(updateSongInfo, 10000);
    updateDateTime(); updateSongInfo();
    
    const mb = document.getElementById("miniBars");
    for(let i=0; i<10; i++){ let b=document.createElement("div"); b.className="mini-bar"; mb.appendChild(b); }
    setInterval(()=>{ if(cassette.classList.contains("playing")){ document.querySelectorAll(".mini-bar").forEach(b=>b.style.height=(Math.random()*16+4)+"px"); } }, 150);
	
const modeText = document.getElementById("modeText");
const signalDot = document.getElementById("signalDot");

function setStatus(state) {

  if (state === "online") {
    signalDot.style.display = "inline-block";
    signalDot.style.background = "#00ff62";
    signalDot.style.boxShadow = "0 0 10px #00ff62";
    modeText.innerText = "ONLINE";
  }

  if (state === "offline") {
    signalDot.style.display = "inline-block";
    signalDot.style.background = "#ff3b3b";
    signalDot.style.boxShadow = "0 0 10px #ff3b3b";
    modeText.innerText = "OFFLINE";
  }

  if (state === "muted") {
    signalDot.style.display = "none";   // 🔥 IMPORTANT: ascunde complet bulina
    modeText.innerText = "🔇 MUTED";
  }
}

audio.onerror = () => {
  console.log("Server căzut, schimb automat...");

  if (currentServer === STREAMS.server1) {
    currentServer = STREAMS.server2;
  } else {
    currentServer = STREAMS.server1;
  }

  audio.src = currentServer.stream;
  audio.play();

  switchBtn.innerText = currentServer.name;
};



// --- PROTECT SCRIPT ---


document.addEventListener("contextmenu", e => e.preventDefault());

document.onkeydown = function(e) {

if(e.keyCode == 123) return false; // F12

if(e.ctrlKey && e.shiftKey && e.keyCode == 73) return false; // CTRL+SHIFT+I

if(e.ctrlKey && e.shiftKey && e.keyCode == 74) return false; // CTRL+SHIFT+J

if(e.ctrlKey && e.keyCode == 85) return false; // CTRL+U

};
