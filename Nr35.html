<!DOCTYPE html>
<html lang="ro">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta charset="UTF-8">
    <title>ByDesign</title>
    <style>
        :root { 
            --neon-green: #00ff41; --neon-pink: #ff0055; --neon-cyan: #00ffea; --dark-bg: #050505; 
        }
        body { 
            background: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; 
            display: flex; flex-direction: column; align-items: center; padding: 20px;
            user-select: none; 
        }

        .animated-border {
            position: relative;
            background: #222;
            border-radius: 25px;
            padding: 6px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 0;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        .animated-border::before {
            content: '';
            position: absolute;
            width: 150%; height: 150%;
            background: conic-gradient(var(--neon-pink), var(--neon-cyan), var(--neon-green), var(--neon-pink));
            animation: rotateBorder 4s linear infinite;
            z-index: -2;
        }

        @keyframes rotateBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .master-panel { 
            width: 940px; 
            display: grid; 
            grid-template-columns: 600px 320px; 
            gap: 20px;
            padding: 25px;
            border-radius: 20px;
            position: relative;
            z-index: 1;
            background-image: url('https://xatimg.com/image/w1NnqBu9Jj1p.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .left-side { display: flex; flex-direction: column; gap: 20px; }
        .top-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .sub-card-animated {
            position: relative;
            background: rgba(0, 0, 0, 0.85); 
            border-radius: 15px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            min-height: 120px;
            overflow: hidden;
            z-index: 0;
        }
        .sub-card-animated::before {
            content: ''; position: absolute; width: 200%; height: 200%;
            background: conic-gradient(transparent, transparent, var(--neon-cyan), transparent);
            animation: rotateBorder 3s linear infinite; z-index: -2;
        }
        .sub-card-animated::after {
            content: ''; position: absolute; inset: 2px; background: rgba(10,10,10,0.95); border-radius: 13px; z-index: -1;
        }

        .vintage-clock {
            position: relative; width: 95px; height: 95px;
            border: 4px solid #888; border-radius: 50%; background: #fdfae5;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .number { position: absolute; width: 100%; height: 100%; text-align: center; font-weight: bold; color: #333; font-size: 10px; padding: 2px; transform: rotate(var(--rot)); }
        .number span { display: inline-block; transform: rotate(calc(var(--rot) * -1)); }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; transform: translateX(-50%); border-radius: 10px; }
        .hour-hand { width: 4px; height: 26px; background: #222; z-index: 3; }
        .min-hand { width: 3px; height: 35px; background: #444; z-index: 4; }
        .sec-hand { width: 1.5px; height: 40px; background: #d00; z-index: 5; }
        .center-dot { position: absolute; width: 6px; height: 6px; background: #000; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; }

        .audio-engine-animated {
            position: relative; border-radius: 20px; padding: 25px; display: flex; align-items: center; gap: 25px; overflow: hidden; z-index: 0;
        }
        .audio-engine-animated::before {
            content: ''; position: absolute; width: 150%; height: 150%;
            background: conic-gradient(transparent, var(--neon-pink), transparent, transparent);
            animation: rotateBorder 5s linear infinite reverse; z-index: -2;
        }
        .audio-engine-animated::after {
            content: ''; position: absolute; inset: 3px; background: rgba(0,0,0,0.95); border-radius: 17px; z-index: -1;
        }

        #cover-img { width: 130px; height: 130px; border-radius: 50%; border: 3px solid var(--neon-pink); object-fit: cover; }
        .rotating { animation: rotateImg 12s linear infinite; }
        @keyframes rotateImg { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .media-area-animated { 
            position: relative; width: 320px; height: 355px; border-radius: 20px; overflow: hidden; z-index: 0;
        }
        .media-area-animated::before {
            content: ''; position: absolute; width: 200%; height: 200%;
            background: conic-gradient(var(--neon-cyan), transparent, transparent, transparent);
            animation: rotateBorder 3s linear infinite; z-index: -2;
        }
        .media-area-animated::after {
            content: ''; position: absolute; inset: 3px; background: #000; border-radius: 17px; z-index: -1;
        }
        .media-area-animated img { width: 100%; height: 100%; object-fit: cover; border-radius: 15px; }

        .station-title { 
            font-size: 1.6rem; color: var(--neon-pink); margin: 0; font-family: serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,1); 
        }
        #track-name { color: var(--neon-green); font-family: monospace; font-size: 0.85rem; margin: 8px 0; text-shadow: 1px 1px 2px #000; }
        .btn-play { background: var(--neon-pink); border: none; color: white; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .bottom-marquee { 
            grid-column: span 2; background: rgba(0,0,0,0.9); border: 1px solid var(--neon-green); 
            padding: 10px; border-radius: 12px; overflow: hidden; white-space: nowrap; margin-top: 10px;
        }
        .marquee-track { display: inline-block; animation: scroll 40s linear infinite; color: var(--neon-green); font-family: monospace; font-weight: bold; }
        @keyframes scroll { from { transform: translateX(100%); } to { transform: translateX(-110%); } }

.social-bar {

.social-bar a:hover {

.social-bar i {

#vol-icon:hover {

#vol-icon {
    transition: 0.3s ease;
}



</style>

<script>
const _STREAM = "https://radio.sonicpanel.ro:10922/radio.mp3";
const _API = "https://radio.sonicpanel.ro:10922/stats?json=1";

const audio = new Audio(_STREAM);
audio.crossOrigin = "anonymous";
let isPlaying = false;

/* ===================== RADIO ===================== */
function toggleRadio() {
    const btn = document.getElementById('p-btn');
    const img = document.getElementById('cover-img');

    if (!isPlaying) {
        audio.play().catch(e => console.log(e));
        btn.innerText = "STOP";
        img.classList.add('rotating');
        isPlaying = true;
    } else {
        audio.pause();
        btn.innerText = "PLAY";
        img.classList.remove('rotating');
        isPlaying = false;
    }
}

/* ===================== VOLUME ===================== */
const volSlider = document.getElementById("vol-slider");
const volBar = document.getElementById("vol-bar");
const volIcon = document.getElementById("vol-icon");
const volText = document.getElementById("vol-percent");

let lastVolume = 1;

function updateVolumeUI(v) {
    audio.volume = v;
    volBar.style.width = (v * 100) + "%";

    if (v == 0) volIcon.className = "fas fa-volume-mute";
    else if (v < 0.5) volIcon.className = "fas fa-volume-down";
    else volIcon.className = "fas fa-volume-up";

    if (volText) volText.innerText = Math.round(v * 100) + "%";
}

volSlider.addEventListener("input", () => {
    lastVolume = volSlider.value;
    updateVolumeUI(volSlider.value);
});

volIcon.addEventListener("click", () => {
    if (audio.volume > 0) {
        lastVolume = audio.volume;
        volSlider.value = 0;
        updateVolumeUI(0);
    } else {
        volSlider.value = lastVolume;
        updateVolumeUI(lastVolume);
    }
});

/* ===================== METEO ===================== */
async function updateMeteo() {
    try {
        const res = await fetch("https://ipapi.co/json/");
        const loc = await res.json();

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m`;
        const data = await (await fetch(url)).json();

        document.getElementById('weather-val').innerText =
            data.current?.temperature_2m !== undefined
                ? Math.round(data.current.temperature_2m) + "°C"
                : "--°C";

    } catch {
        document.getElementById('weather-val').innerText = "10°C";
    }
}

/* ===================== RADIO INFO ===================== */
async function updateTrack(){
    try{
        const d = await (await fetch(_API)).json();

        let track =
            d.songtitle ||
            d.current_song ||
            d.nowplaying ||
            "No track";

        document.getElementById('track-name').innerText = track;

        const listeners = d.currentlisteners ?? 0;
        document.getElementById('listeners-count').innerText = listeners + " online";

        if (isPlaying && d.art) {
            document.getElementById('cover-img').src = d.art;
        }

        // history local
        if(track && track !== lastSong){
            lastSong = track;
            songHistory.unshift(track);
            songHistory = songHistory.slice(0, 5);
        }

    } catch {
        document.getElementById('track-name').innerText = "Offline";
        document.getElementById('listeners-count').innerText = "0 online";
    }
}

/* ===================== CLOCK ===================== */
function updateClock() {
    const now = new Date();
    const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();

    document.getElementById('h-hand').style.transform =
        `translateX(-50%) rotate(${(h * 30) + (m / 2)}deg)`;

    document.getElementById('m-hand').style.transform =
        `translateX(-50%) rotate(${(m * 6) + (s / 10)}deg)`;

    document.getElementById('s-hand').style.transform =
        `translateX(-50%) rotate(${s * 6}deg)`;
}

/* ===================== DATE ===================== */
function updateDate() {
    const now = new Date();

    const days = ["Duminică","Luni","Marți","Miercuri","Joi","Vineri","Sâmbătă"];
    const months = ["Ianuarie","Februarie","Martie","Aprilie","Mai","Iunie","Iulie","August","Septembrie","Octombrie","Noiembrie","Decembrie"];

    document.getElementById("date-val").innerText =
        `${days[now.getDay()].toUpperCase()} ${now.getDate()} ${months[now.getMonth()].toUpperCase()} ${now.getFullYear()}`;
}

/* ===================== HOROSCOPE ===================== */
function getZodiacSign(day, month) {
    const signs = [
        { name: "Capricorn", icon: "fa-mountain", from: [12,22], to: [1,19] },
        { name: "Varsator", icon: "fa-water", from: [1,20], to: [2,18] },
        { name: "Pesti", icon: "fa-fish", from: [2,19], to: [3,20] },
        { name: "Berbec", icon: "fa-horse-head", from: [3,21], to: [4,19] },
        { name: "Taur", icon: "fa-cow", from: [4,20], to: [5,20] },
        { name: "Gemeni", icon: "fa-user-group", from: [5,21], to: [6,20] },
        { name: "Rac", icon: "fa-shrimp", from: [6,21], to: [7,22] },
        { name: "Leu", icon: "fa-crown", from: [7,23], to: [8,22] },
        { name: "Fecioara", icon: "fa-seedling", from: [8,23], to: [9,22] },
        { name: "Balanta", icon: "fa-scale-balanced", from: [9,23], to: [10,22] },
        { name: "Scorpion", icon: "fa-spider", from: [10,23], to: [11,21] },
        { name: "Sagetator", icon: "fa-bullseye", from: [11,22], to: [12,21] }
    ];

    for (let s of signs) {
        if ((month === s.from[0] && day >= s.from[1]) ||
            (month === s.to[0] && day <= s.to[1])) {
            return s;
        }
    }
}

function generateHoroscope() {
    const texts = [
        "Zi buna pentru tine.",
        "Ai grija la decizii.",
        "Noroc in dragoste.",
        "Focus pe bani.",
        "Energie pozitiva azi."
    ];

    const now = new Date();
    const sign = getZodiacSign(now.getDate(), now.getMonth() + 1);

    document.getElementById("zodiac-name").innerText = sign.name.toUpperCase();
    document.getElementById("zodiac-text").innerText =
        texts[Math.floor(Math.random() * texts.length)];

    document.getElementById("zodiac-icon").className =
        "fa-solid " + sign.icon;
}

/* ===================== START ===================== */
setInterval(updateClock, 1000);
setInterval(updateDate, 60000);
setInterval(updateTrack, 15000);
setInterval(updateMeteo, 300000);

updateClock();
updateDate();
updateMeteo();
updateTrack();
generateHoroscope();

updateVolumeUI(1);
volSlider.value = 1;

let songHistory = [];
let lastSong = "";



/* ===== OPEN HISTORY ===== */
function openHistory(){
    const modal = document.getElementById("historyModal");
    const list = document.getElementById("historyList");

    list.innerHTML = "";

    if(songHistory.length === 0){
        list.innerHTML = "<div style='color:#ff0055'>No history yet</div>";
    } else {
        songHistory.forEach(song => {
            let div = document.createElement("div");
            div.innerText = song;
            list.appendChild(div);
        });
    }

    modal.style.top = "20px";
}

/* ===== CLOSE ===== */
function openHistory(){
    document.getElementById("historyModal").style.top = "20px";
}

function closeHistory(){
    document.getElementById("historyModal").style.top = "-600px";
}

// --- PROTECT SCRIPT ---


document.addEventListener("contextmenu", e => e.preventDefault());

document.onkeydown = function(e) {

if(e.keyCode == 123) return false; // F12

if(e.ctrlKey && e.shiftKey && e.keyCode == 73) return false; // CTRL+SHIFT+I

if(e.ctrlKey && e.shiftKey && e.keyCode == 74) return false; // CTRL+SHIFT+J

if(e.ctrlKey && e.keyCode == 85) return false; // CTRL+U

};
</script>
