<script>
let colors = ["#00ccff", "#ff0000", "#00ff00", "#ffff00", "#ff00ff", "#ffffff", "#ff8800", "#00ffaa", "#8800ff", "#0060ff"];
let playing = false, audioCtx, analyser, dataArray, filters = [];
const stream = "https://radio.sonicpanel.ro:10922/stream?icy=http";
let audio = new Audio(stream); 
audio.crossOrigin = "anonymous";

function startAudio() {
    if(!playing) {
        if(!audioCtx) {
            // Creează context audio
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;
            dataArray = new Uint8Array(analyser.frequencyBinCount);

            // Creează sursa audio
            let src = audioCtx.createMediaElementSource(audio);

            // Creează filtre EQ: Bass, Mid, High
            [60, 1000, 8000].forEach((f,i) => {
                let flt = audioCtx.createBiquadFilter();
                flt.type = "peaking";
                flt.frequency.value = f;
                flt.gain.value = 0; // plat
                filters.push(flt);
                if(i>0) filters[i-1].connect(flt);
            });

            // Creează filtru separat pentru bass pentru analizor
            let bassFilter = audioCtx.createBiquadFilter();
            bassFilter.type = "lowshelf";
            bassFilter.frequency.value = 200; // frecvențe joase
            bassFilter.gain.value = 0;

            // Conectează sursa la filtrul bass și la analizor
            src.connect(bassFilter);
            bassFilter.connect(analyser);

            // Conectează filtrele EQ la ieșire audio
            src.connect(filters[0]);
            filters[2].connect(audioCtx.destination);

            // Setează slider-ele la start plat
            document.getElementById('p-val').value = 17;
            document.querySelectorAll('.fader-custom').forEach((el,i) => {
                if(i<3) { el.value = 0; filters[i].gain.value = 0; }
            });

            // Pornește vizualizarea
            render();
        }

        audio.play();
        $('#play-btn').addClass('active-btn');
        $('#stop-btn').removeClass('active-btn');
        $('.vinyl-main').addClass('spinning');
        playing = true;
    }
}

function stopAudio() {
    audio.pause();
    audio.src = stream;
    $('#stop-btn').addClass('active-btn');
    $('#play-btn').removeClass('active-btn');
    $('.vinyl-main').removeClass('spinning');
    playing = false;
}

function setEq(i,v) { if(filters[i]) filters[i].gain.value = v; }
const volSlider = document.getElementById('vol-slider');

volSlider.addEventListener('input', function() {
    let val = this.value;          
    audio.volume = val / 100;      
    document.getElementById('vol-display').innerText = "Volum " + val + "%";

    this.style.background = `linear-gradient(to right, var(--neon-dynamic) 0%, var(--neon-dynamic) ${val}%, #111 ${val}%, #111 100%)`;
});

volSlider.style.background = `linear-gradient(to right, var(--neon-dynamic) 0%, var(--neon-dynamic) 100%, #111 100%, #111 100%)`;

// Render vizualizare și puls woofer
function render() {
    requestAnimationFrame(render);
    if(!analyser) return;
    analyser.getByteFrequencyData(dataArray);

    // Bare vizualizator
    let bars = document.getElementsByClassName('bar');
    for(let i=0;i<bars.length;i++) {
        let h = (dataArray[i]/255)*75;
        bars[i].style.height = (h+4)+'px';
    }

    if(playing) {
        let p_sens = document.getElementById('p-val').value / 12;

        // Puls bass: media primelor 5 frecvente
        let bass = 0;
        for(let i=0;i<5;i++) bass += dataArray[i];
        bass /= 5;

        let baseScale = 1.0;
        let pulseAmount = (bass/255)*0.15*(p_sens>0.5?p_sens:0.8);
        let scale = baseScale + pulseAmount;

        $('#wf-l,#wf-r').css('transform',`scale(${scale})`);
    }
}

// Color ring
function initColorRing() {
    const ring = document.getElementById('color-ring');
    for(let i=1;i<=10;i++) {
        const btn = document.createElement('div');
        btn.className = `color-btn cb-${i}`;
        btn.innerText = i;
        const angle = (i-1)*36-90;
        const rad = 46;
        btn.style.left = (50 + rad*Math.cos(angle*Math.PI/180)) + '%';
        btn.style.top = (50 + rad*Math.sin(angle*Math.PI/180)) + '%';
        btn.style.transform = 'translate(-50%,-50%)';
		btn.style.color = colors[i-1]; // fiecare buton ia culoarea corespunzătoare
        btn.onclick = (e)=>{ e.stopPropagation(); setColor(i-1); };
        ring.appendChild(btn);
    }
    setColor(0);
}

function setColor(idx) {
    window.stepCol = idx;
    let color = colors[idx];
    document.documentElement.style.setProperty('--neon-dynamic', color);
    document.getElementById('knob-rot').style.transform = `rotate(${idx*36}deg)`;
    $('.color-btn').removeClass('active');
    $(`.cb-${idx+1}`).addClass('active');

    // sincronizare box-ul melodiei
    const songBox = document.getElementById('marquee-box');
    songBox.style.borderColor = color;
    songBox.style.color = color;
    songBox.style.boxShadow = `0 0 15px ${color}`;
}

function rotateColorsAndExpand() { setColor(((window.stepCol||0)+1)%10); }

const controlBar = document.getElementById('control-bar');
const playBtn = document.getElementById('play-btn');
const stopBtn = document.getElementById('stop-btn');

// PLAY hover → verde
playBtn.addEventListener('mouseenter', () => {
    controlBar.classList.add('green-glow');
});
playBtn.addEventListener('mouseleave', () => {
    controlBar.classList.remove('green-glow');
});

// STOP hover → roșu
stopBtn.addEventListener('mouseenter', () => {
    controlBar.classList.add('red-glow');
});
stopBtn.addEventListener('mouseleave', () => {
    controlBar.classList.remove('red-glow');
});


    setInterval(updateMeta, 10000); updateMeta();
    initColorRing();
    const container = document.getElementById('viz-container');

        b.className = 'bar';
        container.appendChild(b);
    }
	
	window.addEventListener('load', () => {
    // Setăm slider-ele B/M/H la 0 și P la 17
    document.querySelectorAll('.fader-custom').forEach((el, i) => {
        if (i < 3) el.value = 0;           // B, M, H
    });
    document.getElementById('p-val').value = 17; // P la mijloc

    // Dacă filtrele deja există (după primul startAudio), resetează-le la 0
    filters.forEach(flt => flt.gain.value = 0);
});


function updateMarquee(song, artist) {
    const marquee = document.getElementById('marquee-box');
    marquee.innerHTML = `<span>${artist.toUpperCase()} - ${song.toUpperCase()}</span>`;
}

// Exemplu de integrare cu updateMeta
async function updateMeta() {
    try {
        const response = await fetch("https://radio.sonicpanel.ro:10922/stats?sid=1&json=1");
        const data = await response.json();

        if(data.songtitle) {
            let title = data.songtitle;
            let artist = data.artist || "<<<• • • ♫ • • •LaFamilia";

            // Afișăm în box
            const marquee = document.getElementById('marquee-box');
            marquee.innerHTML = `<span>${artist.toUpperCase()} • • • ♫ • • •>>> ${title.toUpperCase()}</span>`;

            // Imagine vinyl
            const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(artist + " " + title)}&limit=1`);
            const itunes = await res.json();
            let img = (itunes.results && itunes.results[0]) ? itunes.results[0].artworkUrl100.replace('100x100','600x600') : "https://xatimg.com/image/oacvd5ltA14X.png";
            document.getElementById('v-disk').style.backgroundImage = `url(${img})`;
        }
    } catch(err) {
        console.error("Nu am putut actualiza meta:", err);
    }
}

    setInterval(updateMeta, 10000); updateMeta();
    initColorRing();


function triggerTroll() {
    // salvăm că trebuie să pornească după refresh
    localStorage.setItem("autoPlayAfterRefresh", "true");

    // refresh pagină
    location.reload();
}

window.addEventListener('load', () => {
    // verificăm dacă trebuie autoplay
    if(localStorage.getItem("autoPlayAfterRefresh") === "true") {
        localStorage.removeItem("autoPlayAfterRefresh");

        // mic delay ca să fie safe
        setTimeout(() => {
            startAudio();
        }, 500);
    }
});


function setColor(idx) {
    window.stepCol = idx;
    let color = colors[idx];
    document.documentElement.style.setProperty('--neon-dynamic', color);

    // Actualizează glow-ul imaginii
    const rotatingImg = document.getElementById('rotating-img');
    rotatingImg.style.filter = `
        drop-shadow(0 0 10px ${color})
        drop-shadow(0 0 20px ${color})
        drop-shadow(0 0 30px ${color})
    `;

    // restul codului tău deja existent
    document.getElementById('knob-rot').style.transform = `rotate(${idx*36}deg)`;
    $('.color-btn').removeClass('active');
    $(`.cb-${idx+1}`).addClass('active');

    // sincronizare box-ul melodiei
    const songBox = document.getElementById('marquee-box');
    songBox.style.borderColor = color;
    songBox.style.color = color;
    songBox.style.boxShadow = `0 0 15px ${color}`;
}

</script>
</body></html>
