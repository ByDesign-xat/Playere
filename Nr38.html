<body>

    <div class="snake-border">
        <div class="infernale-container">
          <video id="v-source" loop playsinline autoplay muted src="https://bydesign-xat.github.io/Index/LoveHeart.mp4"></video>

                <div id="loc-text" style="line-height: 1.4;"></div>

            <div class="monitor-content">
                <div id="woofer-container">
                 <div id="radio-name">★ Radio LaFamilia ★</div>

				<canvas id="visualizer"></canvas>

                <div class="bottom-ui">
                    <div class="controls">
<div id="date-bottom" style="
    text-align:center;
    font-size:0.7rem;

    padding:5px;
    opacity:0.9;
"></div>
                        <button class="trigger-btn" onclick="mostraAstro()">🔮 HOROSCOP</button>

                        <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="1">

                        <button class="trigger-btn" onclick="mostraMeteo()">🌡️ METEO</button>
<div id="clock-bottom" style="

    <audio id="audio-stream" crossorigin="anonymous"></audio>

    <script>
    const S_URL = "https://radio.sonicpanel.ro:10922/;";
    const STATS_URL = "https://radio.sonicpanel.ro:10922/stats?sid=1&json=1&callback=?";
    const DEF_COV = "https://xatimg.com/image/oacvd5ltA14X.png";

    const aud = document.getElementById("audio-stream");
    const pBtn = document.getElementById("pBtn");
    const tName = document.getElementById("track-name");
    const mCov = document.getElementById("main-cover");
    const woofer = document.getElementById("woofer-container");
    const vid = document.getElementById("v-source");
    const locandina = document.getElementById("info-locandina");

    let isP = false, aCtx, anls, dArr;
	let ac, an, src, da;
const cv = document.getElementById("visualizer");
const ct = cv.getContext("2d");

    function updateInfo() {
        $.getJSON(STATS_URL, function(data) {
            if (data && data.songtitle) {
                const title = data.songtitle.toUpperCase();
                if (tName.innerText !== `🎵 ${title} 🎵`) {
                    tName.innerText = `🎵 ${title} 🎵`;
                    $.getJSON("https://itunes.apple.com/search?term=" + encodeURIComponent(title) + "&limit=1&callback=?", function(res) {
                        const img = res.results[0] ? res.results[0].artworkUrl100.replace('100x100', '500x500') : DEF_COV;
                        $(mCov).fadeOut(500, function() {
                            $(this).css('background-image', 'url(' + img + ')').fadeIn(500);
                        });
                    });
                }
            } else { tName.innerText = ""; }
        });
    }
    setInterval(updateInfo, 2000);

    async function mostraMeteo() {
        try {
            const response = await fetch('https://wttr.in/?format=j1');
            const data = await response.json();
            const area = data.nearest_area[0].areaName[0].value;
            const temp = data.current_condition[0].temp_C;
            const desc = data.current_condition[0].lang_it ? data.current_condition[0].lang_it[0].value : data.current_condition[0].weatherDesc[0].value;
            
            document.getElementById("loc-title").innerText = `🌡️ METEO: ${area.toUpperCase()}`;
            document.getElementById("loc-text").innerHTML = `Temp: ${temp}°C<br>Cer: ${desc}<br>Umiditate: ${data.current_condition[0].humidity}%`;
        } catch (e) {
            document.getElementById("loc-title").innerText = "🌡️ METEO";
            document.getElementById("loc-text").innerText = "Serviziu Indisponibil.";
        }
        triggerLoc();
    }
	
	const now = new Date();

const dataRom = now.toLocaleDateString("ro-RO", {
    weekday: "long",
    day: "2-digit",
    month: "long",
});

function updateClock() {
    const now = new Date();

    const time = now.toLocaleTimeString("ro-RO", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    });

    document.getElementById("clock-bottom").innerText =
        `${time}`;
}

setInterval(updateClock, 1000);
updateClock();

document.getElementById("date-bottom").innerText =
    `${dataRom}`;

async function mostraAstro() {
    try {
        const signMap = {
    1:"berbec",      // aries
    2:"taur",        // taurus
    3:"gemeni",      // gemini
    4:"rac",         // cancer
    5:"leu",         // leo
    6:"fecioară",    // virgo
    7:"balanță",     // libra
    8:"scorpion",    // scorpio
    9:"săgetător",   // sagittarius
    10:"capricorn",  // capricorn
    11:"vărsător",   // aquarius
    12:"pești"       // pisces
};

        const m = new Date().getMonth() + 1;
        const sign = signMap[m];

        document.getElementById("loc-title").innerText = "🔮 HOROSCOP...";
        document.getElementById("loc-text").innerText = "Se încarcă...";

        // 🔥 FIX CORS
        const res = await fetch(`https://api.allorigins.win/raw?url=https://ohmanda.com/api/horoscope/${sign}`);
        const data = await res.json();

        let text = data?.horoscope || "Today is a good day.";

        // 🔥 mic rewrite română
        text = text
            .replace(/today/gi, "astăzi")
            .replace(/you/gi, "tu")
            .replace(/your/gi, "tău")
            .replace(/will/gi, "vei");

        text = text.charAt(0).toUpperCase() + text.slice(1) + " 🔮";

        document.getElementById("loc-title").innerText =
            `🔮 HOROSCOP ${sign.toUpperCase()}`;

        document.getElementById("loc-text").innerText =
            text;

    } catch (e) {
        document.getElementById("loc-title").innerText = "🔮 HOROSCOP";
        document.getElementById("loc-text").innerText =
            "Serviciu indisponibil momentan.";
    }

    triggerLoc();
}

    function triggerLoc() {
        locandina.classList.add("show");
        setTimeout(() => locandina.classList.remove("show"), 8000);
    }

pBtn.onclick = async () => {
    if (isP) {
        isP = false;
        aud.pause();
        pBtn.innerText = "START";
        return;
    }

    isP = true;
    pBtn.disabled = true;

    vid.muted = false;
    vid.play();

    // pornește direct live (fără countdown)
    setTimeout(() => {
        pBtn.disabled = false;
        pBtn.innerText = "START";
        vid.muted = true;
        startStream();
		animateEQ();
        updateInfo();
    }, 300); // mic delay doar ca să pornească video corect
};

async function startStream() {
    if (!ac) {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        an = ac.createAnalyser();
        an.fftSize = 256;

        da = new Uint8Array(an.frequencyBinCount);

        const source = ac.createMediaElementSource(aud);
        source.connect(an);
        an.connect(ac.destination);
    }

    aud.src = S_URL;
    aud.play();
    drawEQ();   // 🔥 IMPORTANT
}



    document.getElementById("vol-slider").oninput = (e) => aud.volume = e.target.value;
	
function rewriteHoroscope(text) {
    // simplu AI-like rewrite (pattern based)
    let t = text.toLowerCase();

    // transformări de stil
    t = t.replace(/you may/g, "astăzi ai șansa să");
    t = t.replace(/you will/g, "vei");
    t = t.replace(/be careful/g, "ai grijă");
    t = t.replace(/opportunity/g, "o oportunitate interesantă");
    t = t.replace(/love/g, "dragoste");
    t = t.replace(/energy/g, "energie pozitivă");
    t = t.replace(/today/g, "astăzi");
    t = t.replace(/try to/g, "încearcă să");
    t = t.replace(/it is time to/g, "este momentul să");

    // capitalizare + stil
    t = t.charAt(0).toUpperCase() + t.slice(1);

    // final radio vibe
    return t + " 🔮";
}



function drawEQ() {
    requestAnimationFrame(drawEQ);

    if (!an) return;

    an.getByteFrequencyData(da);

    const width = cv.width = cv.offsetWidth;
    const height = cv.height = cv.offsetHeight;

    ct.clearRect(0, 0, width, height);

    const bars = 80;
    const step = Math.floor(da.length / bars);
    const barWidth = width / bars;

    for (let i = 0; i < bars; i++) {

        let value = da[i * step];
        let percent = value / 255;

        // 🔥 smoothing REAL (asta face diferența)
        let barHeight = (percent * height);
        barHeight = barHeight < 2 ? 2 : barHeight;

        let x = i * barWidth;
        let y = height - barHeight;

        // 🔥 gradient Spotify-style (ROȘU → PORTOCALIU → GALBEN)
        let gradient = ct.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, "#ff4500");
        gradient.addColorStop(0.4, "#ffcc00");
        gradient.addColorStop(1, "#FF0000");

        ct.fillStyle = gradient;

        // 🔥 bare subțiri ca Spotify
        ct.fillRect(x, y, barWidth * 0.35, barHeight);
    }

    // woofer smooth
    let avg = da.reduce((a,b)=>a+b,0)/da.length;
    woofer.style.transform = `scale(${1 + avg/400})`;
}


// --- PROTECT SCRIPT ---


document.addEventListener("contextmenu", e => e.preventDefault());

document.onkeydown = function(e) {

if(e.keyCode == 123) return false; // F12

if(e.ctrlKey && e.shiftKey && e.keyCode == 73) return false; // CTRL+SHIFT+I

if(e.ctrlKey && e.shiftKey && e.keyCode == 74) return false; // CTRL+SHIFT+J

if(e.ctrlKey && e.keyCode == 85) return false; // CTRL+U

};

</script>
