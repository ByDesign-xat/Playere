<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title> ByDesign</title>
    <style>
/* VARIABILE PRINCIPALE DE CULOARE SI GRADIENT */
:root {
    --rainbow: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
    --accent: #ff00c8;
    --btn-grad: linear-gradient(to right, #ff00c8, #ff7300);
}

/* SETARI GENERALE BODY PAGINA */
body {
    background: transparent !important;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Arial Black', sans-serif;
    overflow: hidden;
}

/* CARCASA PRINCIPALA PLAYER */
.main-chassis {
    position: relative;
    width: 730px;
    height: 630px;
    background: radial-gradient(circle at center, #1a1a20 0%, #050505 100%);
    border-radius: 30px;
    padding: 15px;
    display: grid;
    grid-template-columns: 180px 1fr 180px;
    gap: 10px;
    border: 2px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 30px var(--accent), inset 0 0 50px #000;
    z-index: 1;
}

/* BORDER RAINBOW EXTERIOR PLAYER */
.main-chassis::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 33px;
    padding: 3px;
    background: var(--rainbow);
    background-size: 400%;

    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;

    animation: none;
    z-index: -1;
}

/* ACTIVARE ANIMATIE RAINBOW PE CARCASA */
.main-chassis.rainbow::after{
    animation: rb-move 6s linear infinite;
}

/* DISPLAYUL DE SUS (TITLU / RADIO TEXT) */
.display-top {
    grid-column: 1 / 4;
    height: 65px;
    background: rgba(0,0,0,0.9);
    border: 2px solid transparent;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
}

/* BORDER NORMAL CAND NU ESTE MOD RAINBOW */
#player:not(.rainbow) .display-top{
    border:2px solid var(--accent);
}

/* CUTIE SCROLL TEXT RADIO */
.marquee-box{
    width:100%;
    overflow:hidden;
}

/* TRACK TEXT CARE SE MISCA */
.marquee-track{
    display:inline-block;
    white-space:nowrap;
    animation:scroll-radio 18s linear infinite;
}

/* ANIMATIE SCROLL TEXT RADIO */
@keyframes scroll-radio{
    from { transform:translateX(0); }
    to { transform:translateX(-50%); }
}

/* TEXT RAINBOW PENTRU TITLU RADIO */
.rainbow-text {
    font-size: 28px;
    font-weight: 900;
    text-transform: uppercase;
    background: var(--rainbow);
    background-size: 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rb-move 3s linear infinite;
    padding: 0 50px;
}

/* ANIMATIE ALTERNATIVA SCROLL */
@keyframes bounce-scroll {
0% { transform: translateX(0%); }
100% { transform: translateX(-50%); }
}

/* CUTIILE DE INFO (DJ / HISTORY / ETC) */
.box {
    background: rgba(255,255,255,0.03);
    border:2px solid var(--accent);
    border-radius: 10px;
    padding: 8px;
    text-align: center;
    height: 55px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* TITLURI DIN CUTII */
.box h4 {
    margin: 0;
    font-size: 14px;
    color: #bf953f;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* TEXT VALORI DIN CUTII */
.box span {
    font-size: 11px;
    font-weight: bold;
    display: block;
    margin-top: 3px;
    color: #fff;
    text-shadow: 0 0 8px var(--accent);
}

/* ZONA PLATAN DISC VINYL */
.turntable {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* DISC VINYL */
.vinyl {
    width: 280px;
    height: 280px;
    border-radius: 50%;
    border: 6px solid #0a0a0a;
    box-shadow: 0 0 30px var(--accent);
    overflow: hidden;
    background: #000;
}

/* IMAGINE ALBUM PE VINYL */
#album-art {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
}

/* BRAT PICKUP */
.arm {
    position: absolute;
    width: 110px;
    height: 260px;
    right: -55px;
    top: 45px;
    background: url('https://xatimg.com/image/bhkPQxr12Pdr.png');
    background-size: contain;
    background-repeat: no-repeat;
    transform-origin: top right;
    transform: rotate(-25deg);
    transition: 1.5s cubic-bezier(0.45, 0.05, 0.55, 0.95);
    z-index: 100;
}
/* BOXA WOOFER PRINCIPALA */
.woofer-pro{
    width:95px;
    height:95px;
    border-radius:50%;
    background: radial-gradient(circle,#222 0%,#111 60%,#000 100%);
    border:1px solid #444;
    box-shadow:
        inset 0 0 25px #000,
        0 0 12px var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

/* INEL METALIC AL BOXEI */
.ring{
    position:absolute;
    width:82px;
    height:82px;
    border-radius:50%;
    border:3px solid #666;
    box-shadow:
        inset 0 0 10px #000,
        0 0 4px #000;
}

/* MEMBRANA BOXEI */
.cone{
    width:58px;
    height:58px;
    border-radius:50%;
    background:
    radial-gradient(circle at center,
    #444 0%,
    #222 30%,
    #111 60%,
    #000 100%);
    box-shadow:
    inset 0 0 20px #000,
    inset 0 0 10px #555;
    transition:transform 0.05s linear;
}

/* BARA DE CONTROL (PLAY / VOLUM) */
.control-bar {
    grid-column: 1 / 4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(0,0,0,0.9);
    border-radius: 40px;
    padding: 8px 25px;
    border: 2px solid var(--accent);
}

/* BUTOANE PLAYER */
.btn {
    background: var(--btn-grad);
    border: none;
    padding: 10px 25px;
    border-radius: 8px;
    font-weight: 900;
    cursor: pointer;
    font-size: 13px;
    color: #fff;
    text-shadow: 0 0 5px #000;
    box-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
}

/* SPATIERE BUTON STANGA */
.btn:first-of-type{
margin-left:40px;
}

/* SPATIERE BUTON DREAPTA */
.btn:last-of-type{
margin-right:40px;
}

/* SLIDER VOLUM */
input[type=range] {
    -webkit-appearance: none;
    width: 140px;
    height: 8px;
    background: var(--btn-grad);
    border-radius: 5px;
}

/* CUTIE DOTURI SELECTARE */
.dot-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
    justify-content: center;
    align-items: center;
	margin-left: 20px; /* muta mai in dreapta */
}

/* DOTURI SELECTARE */
.dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid #fff;
    cursor: pointer;
    transition: 0.3s;
}

/* ANIMATIE MISCARE GRADIENT RAINBOW */
@keyframes rb-move{
0%{background-position:0% 50%;}
100%{background-position:400% 50%;}
}

/* ANIMATIE ROTIRE DISC */
@keyframes spin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

/* MOD RAINBOW PENTRU BOXURI SI BARA CONTROL */
#player.rainbow .box,
#player.rainbow .control-bar{
    position:relative;
    border:2px solid transparent;
}

/* BORDER RAINBOW ANIMAT */
#player.rainbow .box::before,
#player.rainbow .control-bar::before{

    content:"";
    position:absolute;
    inset:-2px;
    border-radius:inherit;
    padding:2px;

    background:var(--rainbow);
    background-size:400%;

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;

    animation:rb-move 6s linear infinite;
}

/* GLOW RAINBOW PENTRU VINYL SI BOXA */
#player.rainbow .vinyl,
#player.rainbow .woofer-pro{
    animation: rainbowGlow 3s linear infinite;
}

/* ANIMATIE GLOW RAINBOW */
@keyframes rainbowGlow{
0%{ box-shadow:0 0 20px #ff0000; }
14%{ box-shadow:0 0 20px #ff7300; }
28%{ box-shadow:0 0 20px #fffb00; }
42%{ box-shadow:0 0 20px #48ff00; }
57%{ box-shadow:0 0 20px #00ffd5; }
71%{ box-shadow:0 0 20px #002bff; }
85%{ box-shadow:0 0 20px #7a00ff; }
100%{ box-shadow:0 0 20px #ff00c8; }
}

/* MOD RAINBOW PENTRU ELEMENTELE INTERNE (BOXURI SI BARA CONTROL) */
#player.rainbow .box,
#player.rainbow .control-bar{
    position:relative;
    border:2px solid transparent;
}

/* BORDER RAINBOW ANIMAT PENTRU BOXURI SI CONTROL BAR */
#player.rainbow .box::before,
#player.rainbow .control-bar::before{

    content:"";
    position:absolute;
    inset:-2px;
    border-radius:inherit;
    padding:2px;

    background:var(--rainbow);
    background-size:400%;

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;

    animation:rb-move 6s linear infinite;
}

/* ACTIVARE GLOW RAINBOW PENTRU VINYL SI BOXA */
#player.rainbow .vinyl,
#player.rainbow .woofer-pro{
    animation: rainbowGlow 3s linear infinite;
}

/* ANIMATIE GLOW RAINBOW */
@keyframes rainbowGlow{
0%{ box-shadow:0 0 20px #ff0000; }
14%{ box-shadow:0 0 20px #ff7300; }
28%{ box-shadow:0 0 20px #fffb00; }
42%{ box-shadow:0 0 20px #48ff00; }
57%{ box-shadow:0 0 20px #00ffd5; }
71%{ box-shadow:0 0 20px #002bff; }
85%{ box-shadow:0 0 20px #7a00ff; }
100%{ box-shadow:0 0 20px #ff00c8; }
}

/* DISPLAY TOP IN MOD RAINBOW */
#player.rainbow .display-top{
    border:2px solid transparent;
    background:
        linear-gradient(#000,#000) padding-box,
        var(--rainbow) border-box;
    background-size:100%,400%;
    animation: rb-move 6s linear infinite;
}

/* BORDER RAINBOW ANIMAT PENTRU DISPLAY */
#player.rainbow .display-top::after{
    content:'';
    position:absolute;
    inset:-2px;
    border-radius:12px;
    padding:2px;

    background:var(--rainbow);
    background-size:400%;

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;

    animation:rb-move 6s linear infinite;
    pointer-events:none;
}

/* ACTIV CAND APESI PLAY (VINYL SI BOXA) */
#player.playing .vinyl,
#player.playing .woofer-pro{
    animation: rainbowGlow 3s linear infinite;
}

/* LINIE RAINBOW PE BOXURI SI DISPLAY CAND PLAYERUL ESTE IN PLAY */
#player.playing .box,
#player.playing .display-top{
    border:2px solid transparent;
    position:relative;
}

/* BORDER RAINBOW CU FIX PENTRU CLICK */
#player.rainbow .box::before,
#player.rainbow .control-bar::before{

    content:"";
    position:absolute;
    inset:-2px;
    border-radius:inherit;
    padding:2px;

    background:var(--rainbow);
    background-size:400%;

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;

    animation:rb-move 6s linear infinite;

    pointer-events:none;   /* FIX CLICK */
}

/* CUTIE AFISARE VOLUM */
.vol-box{
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
}

/* TEXT AFISARE VOLUM */
#vol-text{
font-size:12px;
font-weight:bold;
text-shadow:0 0 6px var(--accent);
transition:0.3s;
}

/* TEXT VOLUM CU GRADIENT RAINBOW */
.vol-rainbow{

background: linear-gradient(
90deg,
#ff0000,
#ff7300,
#fffb00,
#48ff00,
#00ffd5,
#002bff,
#7a00ff,
#ff00c8,
#ff0000
);

background-size:400%;

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

animation:vol-rainbow 3s linear infinite;

}

/* ANIMATIE TEXT RAINBOW VOLUM */
@keyframes vol-rainbow{

0%{background-position:0%;}
100%{background-position:400%;}

}

/* THUMB SLIDER VOLUM RAINBOW (CHROME / WEBKIT) */
input[type=range]::-webkit-slider-thumb{
-webkit-appearance:none;
width:18px;
height:18px;
border-radius:4px;

background: linear-gradient(
90deg,
#ff0000,
#ff7300,
#fffb00,
#48ff00,
#00ffd5,
#002bff,
#7a00ff,
#ff00c8,
#ff0000
);

background-size:400% 400%;

border:2px solid #fff;

box-shadow:0 0 10px var(--accent);

cursor:pointer;

animation: sliderRainbowMove 2.5s linear infinite;
}

/* THUMB SLIDER VOLUM RAINBOW (FIREFOX) */
input[type=range]::-moz-range-thumb{
width:18px;
height:18px;
border-radius:4px;

background: linear-gradient(
90deg,
#ff0000,
#ff7300,
#fffb00,
#48ff00,
#00ffd5,
#002bff,
#7a00ff,
#ff00c8,
#ff0000
);

background-size:400% 400%;

border:2px solid #fff;

box-shadow:0 0 10px var(--accent);

cursor:pointer;

animation: sliderRainbowMove 2.5s linear infinite;
}

/* ANIMATIA MISCARII CULORILOR SLIDER */
@keyframes sliderRainbowMove{

0%{
background-position:0% 50%;
}

100%{
background-position:400% 50%;
}

}

/* AFISARE NUMAR LISTENERS */
.listeners{
font-size:13px;
font-weight:bold;
letter-spacing:1px;
margin-top:20px;
color:var(--accent);
text-shadow:0 0 8px var(--accent);
}

/* CONTAINER NUMAR LISTENERS */
.listener-number{
display:inline-block;
position:relative;
overflow:hidden;
height:16px;
}

/* ANIMATIE ROLL NUMAR LISTENERS */
.listener-roll{
display:block;
animation:listenerRoll 0.4s ease;
}

/* ANIMATIE SCHIMBARE NUMAR LISTENERS */
@keyframes listenerRoll{

0%{
transform:translateY(100%);
opacity:0;
}

100%{
transform:translateY(0);
opacity:1;
}

}

/* MOD RAINBOW TEXT LISTENERS */
.listeners-rainbow,
.listeners-rainbow span{

background: linear-gradient(
90deg,
#ff0000,
#ff7300,
#fffb00,
#48ff00,
#00ffd5,
#002bff,
#7a00ff,
#ff00c8,
#ff0000
);

background-size:400%;

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

animation:listenersRainbow 3s linear infinite;

}

/* ANIMATIE TEXT RAINBOW LISTENERS */
@keyframes listenersRainbow{
0%{background-position:0%;}
100%{background-position:400%;}
}

/* EFECT PULSE CAND SE SCHIMBA LISTENERS */
@keyframes listenersPulse{

0%{
transform:scale(1);
text-shadow:0 0 8px var(--accent);
}

50%{
transform:scale(1.4);
text-shadow:0 0 20px var(--accent);
}

100%{
transform:scale(1);
text-shadow:0 0 8px var(--accent);
}

}

/* ACTIVARE ANIMATIE PULSE */
.listeners-pulse{
animation:listenersPulse 0.6s ease;
}

/* CONTAINER HISTORY MELODII */
#history{
display:flex;
flex-direction:column;
gap:3px;
font-size:11px;
text-align:left;
margin-top:3px;
}

/* ITEM INDIVIDUAL DIN HISTORY */
.h-item{
border-bottom:1px solid rgba(255,255,255,0.15);
padding-bottom:2px;
color:var(--accent);
}

/* ULTIMUL ITEM HISTORY */
.h-item:last-child{
border-bottom:none;
}

/* TITLU MELODIE HISTORY */
.h1{
color:#ffffff;
text-shadow:0 0 6px #fff;
}

/* CUTIE HISTORY CLICK */
.history-box{
cursor:pointer;
}

/* POPUP HISTORY */
.history-popup{

position:absolute;
left:215px;
top:180px;

width:300px;

background:rgba(0,0,0,0.95);
border-radius:10px;

padding:12px;

border:2px solid var(--accent);

display:flex;
flex-direction:column;
gap:6px;

/* ascuns initial */

opacity:0;
visibility:hidden;

transition:opacity 0.25s ease;
z-index:500;

}

/* APARE POPUP HISTORY LA HOVER */
.history-box:hover + .history-popup{

opacity:1;
visibility:visible;

}

/* ITEM HISTORY DIN POPUP */
.h-item{

font-size:12px;
border-bottom:1px solid rgba(255,255,255,0.2);
padding:4px 0;

color:var(--accent);

}

/* ULTIMUL ITEM POPUP HISTORY */
.h-item:last-child{
border-bottom:none;
}

/* TITLU POPUP HISTORY */
.h1{

color:#ffffff;
text-shadow:0 0 6px #fff;

}

/* TEXT HISTORY RAINBOW IN MOD RAINBOW PLAYER */
#player.rainbow #history-popup .h-item:not(.h1){

background: linear-gradient(
90deg,
#ff0000,
#ff7300,
#fffb00,
#48ff00,
#00ffd5,
#002bff,
#7a00ff,
#ff00c8,
#ff0000
);

background-size:400%;

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

animation: historyRainbow 3s linear infinite;

}

/* ANIMATIE TEXT RAINBOW HISTORY */
@keyframes historyRainbow{
0%{background-position:0%;}
100%{background-position:400%;}
}


</style>

<script>
const _Z = "OjEwOTIyL3N0cmVhbQ==";
const base = "aHR0cHM6Ly9yYWRpby5zb25pY3BhbmVsLnJv";

const p = new Audio(atob(base) + atob(_Z));
p.crossOrigin = "anonymous";

let ctx, aly, dat;
let prevListeners = 0;
let songHistory = [];

    function play() {
        if(!ctx) {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
            aly = ctx.createAnalyser();
            const s = ctx.createMediaElementSource(p);
            s.connect(aly); aly.connect(ctx.destination);
            aly.fftSize = 64; dat = new Uint8Array(aly.frequencyBinCount);
            loop();
        }
        p.play(); ctx.resume();
        document.getElementById('album-art').style.animation = "spin 4s linear infinite";
        document.getElementById('arm').style.transform = "rotate(15deg)";
    }

    function stop() { p.pause(); document.getElementById('album-art').style.animation = "none"; document.getElementById('arm').style.transform = "rotate(-25deg)"; }

    function loop() {
        requestAnimationFrame(loop);
        if(!p.paused) {
            aly.getByteFrequencyData(dat);
            let b = dat[2]/60;

function setT(c){

    const player = document.getElementById("player");
    const listeners = document.querySelector(".listeners");

    listeners.classList.remove("listeners-rainbow");

    if(c === "rb"){

        player.classList.add("rainbow");

        listeners.style.color = "";
        listeners.style.textShadow = "none";
        listeners.classList.add("listeners-rainbow");

    }else{

        player.classList.remove("rainbow");

        document.documentElement.style.setProperty('--accent', c);

        listeners.style.color = c;
        listeners.style.textShadow = "0 0 8px " + c;
    }
}
async function sync() {
    try {

        const r = await fetch("https://radio.sonicpanel.ro:10922/stats?sid=1&json=1&t=" + Date.now());
        const d = await r.json();

        const h = await fetch("https://radio.sonicpanel.ro:10922/played?sid=1&type=json&t=" + Date.now());
        const hist = await h.json();

        updateHistory(hist);

        /* ASCULTATORI */

        let listeners =
            d.listeners ||
            d.currentlisteners ||
            d.icestats?.source?.listeners ||
            0;

        const num = document.getElementById("listeners");
        const newVal = String(listeners).padStart(2,"0");

        if(num.innerText !== newVal){

            num.classList.remove("listener-roll");
            void num.offsetWidth;
            num.classList.add("listener-roll");

            num.innerText = newVal;

        }

        /* EFECT CAND INTRA ASCULTATOR */

        if(listeners > prevListeners){

            num.classList.remove("listeners-pulse");
            void num.offsetWidth;
            num.classList.add("listeners-pulse");

        }

        prevListeners = listeners;

        /* TITLU MELODIE */

        let songTitle =
            d.songtitle ||
            d.title ||
            d.icestats?.source?.title ||
            "";

        if(songTitle){

            const baseTxt =
            "• • • ♫ • • • Radio LaFamilia • • • ♫ • • • ";

            const txt =
            baseTxt +
            songTitle.toUpperCase() +
            " " +
            baseTxt +
            songTitle.toUpperCase() +
            " ";

            document.getElementById("scroll-text").innerText = txt;

            let artist = "LAFAMILIA";
            let song = songTitle;

            if(songTitle.includes('-')){
                const parts = songTitle.split('-');
                artist = parts[0].trim();
                song = parts.slice(1).join('-').trim();
            }

            document.getElementById('artist').innerText = artist.toUpperCase();
            document.getElementById('song').innerText = song.toUpperCase();

        }

    } catch(e){
        console.log("Radio stats error:", e);
    }
}
    setInterval(sync, 1000);
    sync();

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('it-IT'); }, 1000);

const volSlider = document.getElementById("vol");
const volText = document.getElementById("vol-text");

function updateVolume(){

    let percent = Math.round(volSlider.value * 100);

    volText.innerText = "VOL " + percent + "%";

    volText.classList.remove("vol-rainbow");

    if(percent < 30){
        volText.style.color = "#ff0000";
    }
    else if(percent < 70){
        volText.style.color = "#fffb00";
    }
    else if(percent < 90){
        volText.style.color = "#48ff00";
    }
    else{
        volText.style.color = "";
        volText.classList.add("vol-rainbow");
    }

    p.volume = volSlider.value;
}

volSlider.oninput = updateVolume;
