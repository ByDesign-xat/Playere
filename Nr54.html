<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolex Daytona Luxury Gold - Premium</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>
:root {
--gold-light: #fdf5d2;
--gold-mid: #d4af37;
--gold-dark: #a67c00;
--gold-gradient: linear-gradient(145deg, #fdf5d2, #d4af37, #a67c00);
}

body {
margin: 0;
padding: 0;
background: transparent;
font-family: 'Segoe UI', sans-serif;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
user-select: none;
overflow: hidden;
}

#player-wrapper {
display: flex;
flex-direction: column;
width: 750px;
height: 540px;
background: #080808;
border-radius: 35px;
border: 5px solid var(--gold-mid);
box-shadow: 0 0 70px rgba(166, 124, 0, 0.5);
position: relative;
z-index: 10;
overflow: hidden;
}

#trilly-layer {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
pointer-events: none;
z-index: 999;
display: none;
}

.trillyno {
position: absolute;
width: 60px;
height: 60px;
background: url('https://xatimg.com/image/Ffky23716NHS.gif') no-repeat center/contain;
filter: drop-shadow(0 0 5px var(--gold-light));
}

@keyframes orbit {
0% {
top: 2%;
left: 2%;
}

25% {
top: 2%;
left: 88%;
}

50% {
top: 85%;
left: 88%;
}

75% {
top: 85%;
left: 2%;
}

100% {
top: 2%;
left: 2%;
}


}

.t1 {
animation: orbit 10s infinite linear;
}

.t2 {
animation: orbit 10s infinite linear -2s;
}

.t3 {
animation: orbit 10s infinite linear -4s;
}

.t4 {
animation: orbit 10s infinite linear -6s;
}

.t5 {
animation: orbit 10s infinite linear -8s;
}

.t6 {
animation: orbit 12s infinite reverse linear;
}

.top-bar {
display: flex;
align-items: center;
justify-content: center;
width: 100%;
height: 80px;
background: #000;
border-bottom: 2px solid var(--gold-dark);
}

.marquee-box {
width: 90%;
height: 40px;
overflow: hidden;
border-radius: 8px;
border: 1px solid var(--gold-mid);
background: rgba(20,20,20,0.8);
display: flex;
align-items: center;
position: relative;
}

#track-name {
position: absolute;
white-space: nowrap;
color: var(--gold-light);
font-weight: 800;
font-size: 18px;
animation: scroll 15s linear infinite;
}

@keyframes scroll {
0% {
transform: translateX(100%);
}

100% {
transform: translateX(-100%);
}


}

.main-content {
display: flex;
width: 100%;
height: 380px;
}

.left-panel {
width: 45%;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
position: relative;
border-right: 1px solid rgba(212,175,55,0.1);
}

#watch-face {
width: 230px;
height: 230px;
border-radius: 50%;
border: 10px solid var(--gold-mid);
position: relative;
background: #000;
box-shadow: inset 0 0 30px #d4af37, 0 0 20px rgba(0,0,0,0.8);
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
transition: transform 0.2s ease-in-out;
}

#main-cover {
width: 100%;
height: 100%;
object-fit: cover;
border-radius: 50%;
opacity: 0.7;
position: absolute;
z-index: 1;
transition: opacity 0.5s;
}

.wufer-bounce {
animation: wufer-beat 0.5s infinite alternate ease-in-out;
}

@keyframes wufer-beat {
0% {
transform: scale(1);
}

100% {
transform: scale(1.05);
box-shadow: inset 0 0 50px #fdf5d2;
}


}

.wufer-turbo {
animation: wufer-hyper 0.3s infinite alternate;
}

@keyframes wufer-hyper {
0% {
transform: scale(0.98);
}

100% {
transform: scale(1.1);
filter: brightness(1.2);
}


}

#date-box {
position: absolute;
right: 32px;
top: 50%;
transform: translateY(-50%);
width: 36px;
height: 17px;
background: rgba(0, 0, 0, 0.85);
border: 1px solid var(--gold-mid);
border-radius: 3px;
color: var(--gold-light);
display: flex;
align-items: center;
justify-content: center;
z-index: 2;
}

#d-num {
font-size: 14px;
font-weight: 900;
color: #fff;
}

.hand {
position: absolute;
bottom: 50%;
left: 50%;
transform-origin: bottom;
border-radius: 10px;
z-index: 10;
pointer-events: none;
}

.hand.hour {
width: 8px;
height: 55px;
background: var(--gold-light);
border: 1px solid var(--gold-dark);
}

.hand.min {
width: 6px;
height: 85px;
background: var(--gold-light);
border: 1px solid var(--gold-dark);
}

.hand.sec {
width: 3px;
height: 95px;
background: #ff0000;
z-index: 11;
}

.cap {
position: absolute;
width: 14px;
height: 14px;
background: var(--gold-light);
border-radius: 50%;
z-index: 12;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
}

.right-panel {
width: 55%;
background: #000;
position: relative;
overflow: hidden;
}

#v-source {
width: 100%;
height: 100%;
object-fit: cover;
opacity: 0.6;
}

.vol-container {
display: flex;
align-items: center;
gap: 10px;
z-index: 101;
margin-top: 25px;
}

#vol {
-webkit-appearance: none;
width: 120px;;
height: 4px;
background: var(--gold-dark);
border-radius: 2px;
}

#vol::-webkit-slider-thumb {
-webkit-appearance: none;
width: 15px;
height: 15px;
background: var(--gold-light);
border-radius: 50%;
cursor: pointer;
}

.inline-btn {
width: 38px;
height: 38px;
border-radius: 50%;
border: 1px solid var(--gold-light);
background: var(--gold-gradient);
color: #000;
font-size: 8px;
font-weight: 900;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
}

.bottom-bar {
display: flex;
justify-content: space-evenly;
align-items: center;
width: 100%;
height: 80px;
background: #000;
border-top: 2px solid var(--gold-dark);
}

.gold-btn {
width: 60px;
height: 60px;
border-radius: 50%;
border: 2px solid var(--gold-light);
background: var(--gold-gradient);
color: #000;
font-size: 8px;
font-weight: 900;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
cursor: pointer;
text-align: center;
text-transform: uppercase;
line-height: 1.1;
}

.gold-btn span {
    font-size: 9px;
    color: #000;
    display: block;
    margin-top: 2px;
}

#internal-notify {
    position: absolute;
    top: -120px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--gold-light);
    color: #000;
    padding: 12px 30px;
    border-radius: 30px;
    font-weight: 900;
    z-index: 2000;
    transition: 0.5s;
    border: 2px solid var(--gold-dark);
}

#internal-notify.show {
    top: 20px;
}

#volPercent {
    color: var(--gold-dark);
    font-weight: 900;
    min-width: 45px;
    text-align: center;
}
</style>
</head>
<body>

<div id="player-wrapper">
    <div id="internal-notify"></div>

    <div id="trilly-layer">
        <div class="trillyno t1"></div><div class="trillyno t2"></div><div class="trillyno t3"></div>
        <div class="trillyno t4"></div><div class="trillyno t5"></div><div class="trillyno t6"></div>
    </div>

    <div class="top-bar">
        <div class="marquee-box"><div id="track-name">⚡ PREMIUM GOLD STREAM ACTIVE - DAYTONA EDITION ⚡</div></div>
    </div>

    <div class="main-content">
        <div class="left-panel">
            <div id="watch-face">
                <img id="main-cover" src="https://xatimg.com/image/a4Xs2Y0cAUDJ.png">
                <div id="date-box"><div id="d-num">.</div></div>
                <div class="hand hour" id="h-hour"></div>
                <div class="hand min" id="h-min"></div>
                <div class="hand sec" id="h-sec"></div>
                <div class="cap"></div>
            </div>
            <div class="vol-container">
                <button id="pBtn" class="inline-btn">PLAY</button>
                <input type="range" id="vol" min="0" max="1" step="0.01" value="1">
				<span id="volPercent">100%</span>
                
            </div>
        </div>
        <div class="right-panel">
            <video id="v-source" loop playsinline muted>
                <source src="https://bydesign-xat.github.io/Index/VideoPlay25.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <div class="bottom-bar">
        <div class="gold-btn" onclick="detectUserCity(true)">CITY<br><span id="user-city">...</span></div>
        <div class="gold-btn" onclick="getOroscopo()">HOROSCOPE<br><span id="user-sign">STAR</span></div>
        <div class="gold-btn" onclick="getTitoli()">TITLES<br><span>TRACKS</span></div>
        <div class="gold-btn" onclick="toggleTrilly()">EFFECTS<br><span id="trilly-status">OFF</span></div>
        <div class="gold-btn" onclick="getTotalListeners(true)">LISTENERS<br><span id="count-users">...</span></div>
        <div class="gold-btn" onclick="triggerWuferCover()">COVER<br><span>WUFER</span></div>
    </div>
</div>

<audio id="audio" crossorigin="anonymous"></audio>

<script>
    const STREAM = "https://radio.sonicpanel.ro:10922/stream";
    const STATS = "https://radio.sonicpanel.ro:10922/stats?json=1";

    const aud = document.getElementById("audio"), 
          vid = document.getElementById("v-source"), 
          pBtn = document.getElementById("pBtn"), 
          stopBtn = document.getElementById("stopBtn"),
          volumeSlider = document.getElementById("vol"),
          coverImg = document.getElementById("main-cover"),
          countDisplay = document.getElementById("count-users");

    let isP = false, countdownTimer, metadataInterval, lastTrack = "";
    let turboWufer = false, trillyActive = false;

    // --- FUNZIONE RECUPERO COVER DA ITUNES ---
    function fetchiTunesCover(title) {
        let cleanTitle = title.split('-')[0].trim();
        $.ajax({
            url: ``,
            dataType: 'json',
            success: function(data) {
                if (data.results && data.results.length > 0) {
                    let highRes = data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
                    coverImg.src = highRes;
                } else {
                    coverImg.src = "https://xatimg.com/image/a4Xs2Y0cAUDJ.png";
                }
            },
            error: function() { coverImg.src = "https://xatimg.com/image/a4Xs2Y0cAUDJ.png"; }
        });
    }

    function updateMetadata() {
        $.getJSON(STATS, (data) => {
            if(data.songtitle) {
                document.getElementById("track-name").innerText = "🎵 " + data.songtitle;
                if(data.songtitle !== lastTrack) {
                    fetchiTunesCover(data.songtitle);
                    lastTrack = data.songtitle;
                }
            }
        });
    }

    function getTotalListeners(manual = false) {
        $.ajax({
            url: STATS,
            dataType: 'json',
            timeout: 3000,
            success: function(data) {
                let listeners = data.currentlisteners || 0;
                if(listeners == 0) listeners = Math.floor(Math.random() * 5) + 3;
                countDisplay.innerText = listeners;
                if(manual) sysMsg(`👥 CURRENT LISTENERS: ${listeners}`);
            },
            error: function() { countDisplay.innerText = "--"; }
        });
    }

    function detectUserCity(manual = false) {
        $.getJSON("https://ipapi.co/json/", (d) => {
            let c = d.city ? d.city.toUpperCase() : "ROMA";
            document.getElementById("user-city").innerText = c;
            if(manual) sysMsg("📍 DETECTED POSITION: " + c);
        });
    }

    function getOroscopo() {
        const segni = ["Capricorn", "Aquarius", "Pesci", "Aries", "Taurus", "Gemini", "Cancer", "Leo", "Virgo", "Balance", "Scorpio", "Sagittarius"];
        const perle = ["Luck is on your side today!", "News in love.", "Money coming in.", "Recharge your batteries.", "Guaranteed success.", "Follow your instincts."];
        const oggi = new Date();
        const segnoOggi = segni[oggi.getMonth()];
        const perlaOggi = perle[oggi.getDate() % perle.length];
        sysMsg(`✨ ${segnoOggi.toUpperCase()}: ${perlaOggi}`);
        document.getElementById("user-sign").innerText = segnoOggi.toUpperCase();
    }

    function toggleTrilly() {
        trillyActive = !trillyActive;
        document.getElementById("trilly-layer").style.display = trillyActive ? "block" : "none";
        document.getElementById("trilly-status").innerText = trillyActive ? "ON" : "OFF";
        sysMsg(trillyActive ? "✨ EFFECTS ON ✨" : "✨ EFFECTS OFF ✨");
    }

    function getTitoli() {
        $.getJSON(STATS, (d) => { sysMsg("🎵 Online: " + (d.songtitle || "PREMIUM GOLD STREAM")); });
    }

    function triggerWuferCover() {
        const wf = document.getElementById("watch-face");
        turboWufer = !turboWufer;
        wf.className = turboWufer ? "wufer-turbo" : (isP ? "wufer-bounce" : "");
        sysMsg(turboWufer ? "🔊 TURBO MODE" : "🔊 STANDARD MODE");
    }

    function updateClock() {
        const n = new Date();
        document.getElementById('h-sec').style.transform = `rotate(${n.getSeconds() * 6}deg)`;
        document.getElementById('h-min').style.transform = `rotate(${n.getMinutes() * 6}deg)`;
        document.getElementById('h-hour').style.transform = `rotate(${(n.getHours() % 12) * 30 + n.getMinutes() / 2}deg)`;
        document.getElementById('d-num').innerText = n.getDate();
    }
    setInterval(updateClock, 100);

    function sysMsg(t) {
        const n = document.getElementById("internal-notify");
        n.innerHTML = t; n.classList.add("show");
        setTimeout(() => n.classList.remove("show"), 4000);
    }

function stopStream() {
    sysMsg("🔴 RADIO STOP!");

    isP = false;
    pBtn.innerText = "PLAY";
    document.getElementById("watch-face").className = "";

    clearTimeout(countdownTimer);
    clearInterval(metadataInterval);

    aud.pause();
    aud.src = "";

    vid.pause();
    vid.muted = true;
    vid.currentTime = 0;
}

pBtn.onclick = () => {
    if(isP) {
        stopStream();
        return;
    }

    isP = true;
    pBtn.innerText = "STOP";

    // pornește videoclipul
    vid.muted = true;
    vid.currentTime = 0;
    vid.play();

    // pornește imediat streamul
    aud.src = STREAM;
    aud.volume = volumeSlider.value;

    aud.play().then(() => {
        sysMsg("✨ ON AIR - ENJOY!");
		

        document.getElementById("watch-face").className =
            turboWufer ? "wufer-turbo" : "wufer-bounce";

        updateMetadata();
        metadataInterval = setInterval(updateMetadata, 10000);
    }).catch(err => {
        console.log(err);
    });
};

    
    volumeSlider.oninput = () => {
    aud.volume = volumeSlider.value;
    document.getElementById("volPercent").innerText =
        Math.round(volumeSlider.value * 100) + "%";
};



    $(document).ready(() => {
        getTotalListeners();
        detectUserCity();
        setInterval(getTotalListeners, 30000);
    });
</script>
</body>
</html>
